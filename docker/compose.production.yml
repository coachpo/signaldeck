# Official single-application-image deployment. See deployment.md.
x-core-environment: &core-environment
  SIGNALDECK_RUNTIME_MODE: production
  SIGNALDECK_PLUGIN_MOUNTS_FILE: /etc/signaldeck/plugins/plugin-mounts.json
  DATABASE_URL: ${DATABASE_URL:?Core PostgreSQL URL required}
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?Temporal address required}
  AGENT_PLATFORM_ENCRYPTION_KEY: ${AGENT_PLATFORM_ENCRYPTION_KEY:?Encryption key required}
  SIGNALDECK_ARTIFACT_DIR: /data/artifacts
  SIGNALDECK_CORE_ARTIFACT_DIR: /data/core
  SIGNALDECK_CORE_ENV_DIR: /data/core-environments
  SIGNALDECK_CORE_PYTHON_VERSION: "3.13.13"
  UV_CACHE_DIR: /data/uv-cache

x-core-volumes: &core-volumes
  - plugin-mounts:/etc/signaldeck/plugins:ro
  - target-artifacts:/data/artifacts
  - target-core:/data/core
  - target-core-environments:/data/core-environments
  - target-uv-cache:/data/uv-cache

services:
  app:
    image: ${SIGNALDECK_IMAGE:?Application image with tag or digest required}
    environment:
      <<: *core-environment
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PORT: '8080'
    volumes: *core-volumes
    restart: unless-stopped

    command:
      - app
    ports:
      - 127.0.0.1:${APP_PORT:-8089}:8080
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      plugin-mounts:
        condition: service_completed_successfully
  dispatcher:
    image: ${SIGNALDECK_IMAGE:?Application image with tag or digest required}
    command:
      - dispatcher
    environment: *core-environment
    volumes: *core-volumes
    healthcheck:
      disable: true
    restart: unless-stopped

    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    stop_grace_period: 30s
  worker:
    image: ${SIGNALDECK_IMAGE:?Application image with tag or digest required}
    command:
      - worker
    environment: *core-environment
    volumes: *core-volumes
    healthcheck:
      disable: true
    stop_grace_period: 30s
    restart: unless-stopped

    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
  finance:
    profiles: ["finance"]
    image: ${SIGNALDECK_FINANCE_IMAGE:-signaldeck-finance:1.5.0}
    environment:
      PLUGIN_DATABASE_URL: ${FINANCE_DATABASE_URL:-}
      PLUGIN_ENDPOINT: http://finance:8000/mcp/
      PLUGIN_PAGE_URL: /apps/{artifactDigest}/
      EDGAR_CONTACT_EMAIL: ${EDGAR_CONTACT_EMAIL:-}
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
  digital-oracle:
    profiles: ["digital-oracle"]
    image: ${SIGNALDECK_ORACLE_IMAGE:-signaldeck-digital-oracle:1.0.0}
    environment:
      PLUGIN_ENDPOINT: http://digital-oracle:8000/mcp/
      FRED_API_KEY: ${FRED_API_KEY:-}
      EDGAR_CONTACT_EMAIL: ${EDGAR_CONTACT_EMAIL:-}
    restart: unless-stopped

  notes:
    profiles: ["notes"]
    image: ${SIGNALDECK_NOTES_IMAGE:-signaldeck-notes:1.3.0}
    environment:
      PLUGIN_DATABASE_URL: ${NOTES_DATABASE_URL:-}
      PLUGIN_ENDPOINT: http://notes:8000/mcp/
      PLUGIN_PAGE_URL: /apps/{artifactDigest}/
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16.15-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    restart: unless-stopped
    environment:
      POSTGRES_USER: signaldeck_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bootstrap password required}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?Core password required}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Finance password required}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD:?Notes password required}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Temporal password required}
    volumes:
      - capy-postgres:/var/lib/postgresql/data
      - type: bind
        source: ./init-target-databases.sh
        target: /docker-entrypoint-initdb.d/10-target-databases.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./init-temporal-databases.sh
        target: /docker-entrypoint-initdb.d/20-temporal-databases.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "signaldeck_bootstrap", "-d", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal-schema:
    image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    entrypoint: ["sh", "/etc/signaldeck/init-temporal-schema.sh"]
    environment:
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Temporal password required}
    volumes:
      - type: bind
        source: ./init-temporal-schema.sh
        target: /etc/signaldeck/init-temporal-schema.sh
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

  temporal:
    image: temporalio/server:1.31.2@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
    restart: unless-stopped
    environment:
      DB: postgres12
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_ALLOW_NO_AUTH: "true"
      DB_PORT: 5432
      POSTGRES_SEEDS: db
      POSTGRES_USER: signaldeck_temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Temporal password required}
      DBNAME: signaldeck_temporal
      VISIBILITY_DBNAME: signaldeck_temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yml
    volumes:
      - type: bind
        source: ./temporal-dynamicconfig.yml
        target: /etc/temporal/dynamicconfig.yml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 2s
      timeout: 5s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    entrypoint: ["sh", "/etc/signaldeck/init-temporal-namespace.sh"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - type: bind
        source: ./init-temporal-namespace.sh
        target: /etc/signaldeck/init-temporal-namespace.sh
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      temporal:
        condition: service_healthy

  plugin-mounts:
    image: ${SIGNALDECK_IMAGE:?Application image with tag or digest required}
    command:
      - python
      - /opt/signaldeck/initialize_plugin_mounts.py
    environment:
      SIGNALDECK_PLUGINS: ${SIGNALDECK_PLUGINS:-}
      SIGNALDECK_PLUGIN_MOUNTS_FILE: /data/plugins/plugin-mounts.json
    volumes:
      - plugin-mounts:/data/plugins
    depends_on:
      finance:
        condition: service_started
        required: false
      notes:
        condition: service_started
        required: false
      digital-oracle:
        condition: service_started
        required: false
    healthcheck:
      disable: true
  bootstrap:
    image: ${SIGNALDECK_IMAGE:?Application image with tag or digest required}
    command:
      - python
      - /opt/signaldeck/bootstrap_plugins.py
    environment:
      SIGNALDECK_API_URL: http://app:8080/api
      SIGNALDECK_PLUGINS: ${SIGNALDECK_PLUGINS:-}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
volumes:
  target-artifacts:
  target-core:
  target-core-environments:
  target-uv-cache:
  capy-postgres:
  plugin-mounts:
