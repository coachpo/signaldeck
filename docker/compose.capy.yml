# Single-host trusted-network infrastructure; layer over compose.production.example.yml.
services:
  db:
    image: postgres:16.15-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    restart: unless-stopped
    environment:
      POSTGRES_USER: signaldeck_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bootstrap password required}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?Core password required}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Finance password required}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD:?Notes password required}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Temporal password required}
    volumes:
      - capy-postgres:/var/lib/postgresql/data
      - type: bind
        source: ./init-target-databases.sh
        target: /docker-entrypoint-initdb.d/10-target-databases.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./init-temporal-databases.sh
        target: /docker-entrypoint-initdb.d/20-temporal-databases.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "signaldeck_bootstrap", "-d", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal-schema:
    image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    entrypoint: ["sh", "/etc/signaldeck/init-temporal-schema.sh"]
    environment:
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Temporal password required}
    volumes:
      - type: bind
        source: ./init-temporal-schema.sh
        target: /etc/signaldeck/init-temporal-schema.sh
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

  temporal:
    image: temporalio/server:1.31.2@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
    restart: unless-stopped
    environment:
      DB: postgres12
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_ALLOW_NO_AUTH: "true"
      DB_PORT: 5432
      POSTGRES_SEEDS: db
      POSTGRES_USER: signaldeck_temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Temporal password required}
      DBNAME: signaldeck_temporal
      VISIBILITY_DBNAME: signaldeck_temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yml
    volumes:
      - type: bind
        source: ./temporal-dynamicconfig.yml
        target: /etc/temporal/dynamicconfig.yml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 2s
      timeout: 5s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    entrypoint: ["sh", "/etc/signaldeck/init-temporal-namespace.sh"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - type: bind
        source: ./init-temporal-namespace.sh
        target: /etc/signaldeck/init-temporal-namespace.sh
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      temporal:
        condition: service_healthy

  backend:
    depends_on:
      db:
        condition: service_healthy

  dispatcher:
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully

  worker:
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully

  finance:
    depends_on:
      db:
        condition: service_healthy

  notes:
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    profiles: ["bootstrap"]
    image: ${SIGNALDECK_BACKEND_IMAGE:?Backend image required}
    command: ["python", "/etc/signaldeck/bootstrap_plugins.py"]
    environment:
      SIGNALDECK_API_URL: http://backend:8000/api
      SIGNALDECK_API_TOKEN: ${SIGNALDECK_API_TOKEN:?API token required}
      SIGNALDECK_PLUGINS: ${SIGNALDECK_PLUGINS:-finance,digital-oracle,notes}
    volumes:
      - type: bind
        source: ./bootstrap_plugins.py
        target: /etc/signaldeck/bootstrap_plugins.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./plugin-defaults.json
        target: /etc/signaldeck/plugin-defaults.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy

volumes:
  capy-postgres:
