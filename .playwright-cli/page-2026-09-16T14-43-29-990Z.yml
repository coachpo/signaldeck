              - generic [ref=e250]:
                - paragraph [ref=e251]:
                  - strong [ref=e252]: 结论
                  - text: ：证据不足（insufficient_evidence），不能用中性替代缺数据。
                - paragraph [ref=e253]:
                  - strong [ref=e254]: 可采信
                  - text: ：U1营收96.221B、同比+106%，DC+117%，Q3指引108B±2%、毛利率74%；指引非已实现且未含中国DC。U2的279B是未来承诺；获许可H200出货<DC收入1%；25%关税未转嫁并已计提0.4B。U6为BIS逐案许可，不等于销售。U3-U5与E1-E4一致：CPI环比+0.4%、失业率4.1%、Q2GDP年化+1.5%。M1/M2显示破SMA20、RSI45.7。
