              - paragraph [ref=f3e1828]:
                - strong [ref=f3e1829]: 对方论据1：需求可见性
                - text: （U1/U2）。公司、宏观、市场、新闻四份材料都支持营收与指引的事实，但U2的279B是未来采购承诺而非当期收入，Q3指引也未含中国DC计算；因此动量成立，不能推出高估值安全。
                - strong [ref=f3e1830]: 对方论据2：贴现环境温和
                - text: （E2/E3）。宏观材料确认联邦基金利率3.63%，但市场/新闻补充8月CPI环比+0.4%、10年期收益率触及2007年高位且FOMC在即（N1），并非一致贴现利好。
                - strong [ref=f3e1831]: 对方论据3：产业催化
                - text: （N4/N5）。两者为二手标题，Meta部署与TSMC 2nm缺乏金额和时点，不能直接计入NVDA收入；同批N2/N3还有AI放缓及TSMC警告。
                - strong [ref=f3e1832]: 修订
                - text: ：撤回“偏空概率大于偏多”的强度表述，改为条件性偏空：仅当Q3低于105.8B或毛利率低于74%、对华许可无进展、利率续升时才占优；无可靠估值、现金流和内部人方向时，“估值缺乏支撑”是缺口而非已证实事实。对方关于需求动量与低失业率的成立点予以承认。
                - strong [ref=f3e1833]: 未决
                - text: ：缺少市值/PE、现金流、内部人方向、9月CPI、FOMC结果，概率差额无法裁定；不能以材料多数替代事实。
