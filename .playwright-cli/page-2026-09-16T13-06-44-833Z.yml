                  - strong [ref=f11e333]: 结论：insufficient_evidence
                  - text: 。asOfDate=2026-09-15、horizonMonths=3，现有证据不足以支撑偏多/偏空方向；“中性”不能替代数据缺口。
                - paragraph [ref=f11e334]:
                  - strong [ref=f11e335]: 可采信证据（事实）
                  - text: ：FRED E1-E4显示失业率4.1%、有效联邦基金利率由3.88%降至3.63%、8月总CPI环比+0.4%/核心+0.3%、Q2实际GDP环比年化+1.5%；E3与BLS U3同源，作一份证据。U1/U2为人工整理的官方来源摘要，未独立核实，暂作低优先级参考：FY27Q2营收$96.2B、数据中心$89.0B、Q3指引$108B±2%、毛利率74.0%；供应承诺$119B增至$279B；H200关税25%未转嫁；对华许可出货<数据中心收入1%。
                - paragraph [ref=f11e336]:
                  - strong [ref=f11e337]: 应排除/降权
                  - text: ：U6（2026-01-13）偏旧，不视为当前政策；“财报兑现→股价偏多”和“高估值承压”均缺股价/估值证据，属推论；“CPI环比为正→降息路径确信/反转”是未经证实的假设；U1/U2来源存在不等于内容已证实。
                - paragraph [ref=f11e338]:
                  - strong [ref=f11e339]: 最大风险
                  - text: ：下行——$279B承诺在需求反转时构成库存/减值，对华限制若较U6加码或致指引下修；上行——$108B指引与$279B承诺显示需求锁定，若财报兑现且利率续降，估值可能获支撑。
                - paragraph [ref=f11e340]:
                  - strong [ref=f11e341]: 失效条件
                  - text: ：若出现独立核实的毛利率<74%或对华实质加码，下行权重上升；若财报兑现且无高估值证据，上行权重上升。
                - paragraph [ref=f11e342]:
                  - strong [ref=f11e343]: 关键缺口
                  - text: ：无NVDA股价/估值、远期盈利、Hyperscaler资本开支、最新对华政策全文；U1/U2待独立核实；CPI同比缺基期。故只能给 insufficient_evidence。
