                  - text: 。U1确实记录FY27Q2营收$96.2B/同比+106%、数据中心$89.0B/+117%、Q3指引$108B±2%、毛利率74%。该事实成立，但U1为人工整理、未独立核实，且从指引到“股价偏多”还需估值与盈利预期证据；market、news均为缺失状态，故该推论得不到完整材料支持。我方修订：不否认U1数字，只把它当作待兑现的指引。
