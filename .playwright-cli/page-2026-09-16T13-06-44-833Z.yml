                - paragraph [ref=f11e350]:
                  - strong [ref=f11e351]: 对方论据2：$279B承诺的尾部风险
                  - text: U2确认供应承诺由$119B增至$279B，事实成立。但U2也显示订单与产能锁定增强，U1的Q3指引$108B±2%环比约+12%，表明需求方证据更强。风险与需求证据并存，无法仅凭该数字看空。
                - paragraph [ref=f11e352]:
