<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Notes · 资料工作区</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js" defer></script></head>
<body><main><header><p class="eyebrow">NOTES / 资料工作区</p><h1>留下的文字，随时找回。</h1><p>浏览已保存的笔记，查找原文与整理结果。</p></header>
<div id="status" role="status" aria-live="polite"></div>
<section id="browse" aria-label="浏览笔记"><form id="search"><label>集合<select id="collection" name="collection" required></select></label><label class="grow">查找标题或正文<input id="query" name="query" type="search" maxlength="200" placeholder="输入要查找的文字"></label><button type="submit">搜索</button></form><p id="summary"></p><div id="notes"></div><nav aria-label="笔记分页"><button id="previous" type="button">上一页</button><span id="page"></span><button id="next" type="button">下一页</button></nav></section>
<section id="detail" hidden aria-label="笔记详情"><div class="actions"><a id="back" href="./">← 返回笔记</a><button id="copy" type="button">复制正文</button></div><p id="noteCollection" class="eyebrow"></p><h2 id="noteTitle"></h2><pre id="noteText"></pre><details><summary>保存标识</summary><code id="noteId"></code></details></section>
</main></body></html>
