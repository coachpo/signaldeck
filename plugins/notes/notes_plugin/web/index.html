<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>资料 · SignalDeck</title>
  <link rel="stylesheet" href="ui/signaldeck-ui.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="ui/signaldeck-ui.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
<header></header>
<main>
  <div class="page-heading"><h1>资料</h1><p>浏览已保存的笔记，查找原文与整理结果。</p></div>
  <div id="status" class="message" role="status" aria-live="polite"></div>
  <section id="browse" aria-label="浏览笔记">
    <form id="search" class="filters panel">
      <label>集合<select id="collection" name="collection" required disabled></select></label>
      <label class="grow">查找标题或正文<input id="query" name="query" type="search" disabled maxlength="200" placeholder="输入要查找的文字"></label>
      <label>检索范围<select id="includeDerived" name="includeDerived" disabled><option value="false">原始资料及来源未分类</option><option value="true">包含整理结果</option></select></label>
      <button type="submit" disabled>搜索</button>
    </form>
    <p id="summary" class="meta"></p>
    <div id="notes"></div>
    <nav class="pager" aria-label="笔记分页"><button id="previous" type="button" disabled>上一页</button><span id="page"></span><button id="next" type="button" disabled>下一页</button></nav>
  </section>
  <section id="detail" class="panel" hidden aria-label="笔记详情">
    <div class="actions"><a id="back" href="./">← 返回笔记</a><button id="copy" type="button">复制正文</button></div>
    <p id="noteCollection" class="meta"></p>
    <h2 id="noteTitle"></h2>
    <p id="noteSourceKind" class="meta"></p>
    <pre id="noteText"></pre>
    <section class="note-sources" aria-label="资料来源"><h3>资料来源</h3><div id="noteSources"></div></section>
  </section>
</main>
</body>
</html>
