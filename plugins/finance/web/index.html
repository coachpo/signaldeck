<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告 · Finance · SignalDeck</title>
<style>
:root{color-scheme:light;--ink:#172b3a;--muted:#586877;--line:#dce3e9;--bg:#f4f6f8;--accent:#17664e}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;background:white;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px}main{max-width:1400px;margin:24px auto;padding:0 24px}button,input,textarea,select{font:inherit;color:inherit}button,select,input,textarea{border:1px solid var(--line);border-radius:5px;background:white;padding:8px 11px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:white;border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}nav,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}nav{margin:14px 0}nav button[aria-pressed=true]{background:#e5f0eb;border-color:var(--accent)}.workspace{align-items:start;display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:7px;padding:18px;min-width:0}.list{max-height:64vh;overflow:auto}.entry{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 6px}.entry.active{background:#eaf3ee}.entry strong{display:block;overflow-wrap:anywhere}.muted,small{color:var(--muted)}label{display:block;margin:12px 0 5px}input,textarea{width:100%}textarea{min-height:130px;resize:vertical}#content{min-height:330px;font-family:ui-monospace,monospace}.filters{margin:12px 0}.filters input{width:160px}.message{min-height:28px;color:var(--accent);overflow-wrap:anywhere}.error{color:#a33027}pre,article{white-space:pre-wrap;overflow-wrap:anywhere}article{line-height:1.9}pre{background:var(--bg);padding:12px;font-size:13px}.pager{display:flex;justify-content:space-between;margin-top:12px}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.author-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px}.field-control{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}.field-control input[type=checkbox]{width:auto}dt{font-weight:600}dd{margin:0 0 8px}aside select{width:100%}.warning{background:#fff5df;padding:10px;border:1px solid #e3c78a}.empty{padding:30px 6px;color:var(--muted)}@media(max-width:1024px){.author-layout{grid-template-columns:1fr}}@media(max-width:767px){header{padding:12px 16px}main{padding:0 12px;margin:16px auto}.workspace{grid-template-columns:1fr}.list{max-height:240px;overflow:auto}.panel{padding:14px}.filters input{width:calc(50% - 4px)}.filters #search{width:100%}.workspace>section:last-child{grid-row:1}}
</style></head><body>
<fieldset id="workspace" style="margin:0;padding:0;border:0;min-width:0">
<header><strong>SignalDeck / Finance</strong><button id="mode" aria-pressed="false">开启专家模式</button></header>
<main><h1>报告</h1><p class="muted">阅读研究结果，或选择已有格式生成报告。</p><nav aria-label="报告工作区"><button data-tab="reports" aria-pressed="true">历史报告</button><button data-tab="templates" aria-pressed="false">使用已有格式</button><button id="new" hidden>新建格式</button><button id="upload" hidden>上传报告</button><input id="file" type="file" accept=".md,text/markdown" hidden></nav>
<div id="message" class="message" role="status" aria-live="polite"></div>
<form id="filters" class="filters"><input id="search" type="search" aria-label="搜索全部报告或格式" placeholder="搜索名称或正文"><select id="source" aria-label="来源"><option value="">所有来源</option><option value="agent">任务生成</option><option value="compiled">格式生成</option><option value="uploaded">文件上传</option><option value="external">手动创建</option></select><input id="ticker" aria-label="证券代码" placeholder="证券代码"><input id="tag" aria-label="标签" placeholder="标签"><input id="review-type" aria-label="研究类型" placeholder="研究类型"><select id="sort" aria-label="排序"><option value="newest">最新优先</option><option value="oldest">最早优先</option><option value="name">名称排序</option></select><button>查询</button></form>
<div class="workspace"><section class="panel"><div id="list" class="list" aria-label="查询结果"></div><div class="pager"><button id="previous">上一页</button><span id="page" aria-live="polite"></span><button id="next">下一页</button></div></section><section class="panel"><div id="blank" class="empty">选择一份报告阅读，或切换到“使用已有格式”。</div>
<div id="reading" hidden><h2 id="report-title"></h2><div id="report-meta" class="meta"></div><p id="report-missing" class="warning" hidden></p><div class="actions"><button id="download">下载 Markdown</button><button id="edit-report" hidden>编辑报告</button><button id="delete-report" hidden>删除报告</button></div><article id="report-body" aria-label="报告正文"></article><section aria-label="报告来源"><h3>报告来源</h3><p id="provenance-summary"></p><dl id="provenance"></dl></section></div>
<form id="author" style="margin-top:20px" hidden><h2 id="author-title">制作报告格式</h2><div class="author-layout"><div><label for="name">名称</label><input id="name" required maxlength="100"><label for="content">报告正文</label><p class="meta">直接填写正文，可用下方按钮加入需要每次填写的信息或已有报告。正文支持标题、列表和代码段。</p><textarea id="content" required spellcheck="false"></textarea><div class="actions"><button class="primary">保存</button><button type="button" id="author-preview">预览草稿</button><button type="button" id="delete">删除格式</button></div><p id="draft-note" class="meta"></p></div><aside><h3>需要填写的信息</h3><div id="field-list"></div><label for="field-label">新填写项的名称</label><input id="field-label" placeholder="例如：公司名称" maxlength="80"><label for="field-required"><input style="width:auto" type="checkbox" id="field-required" checked> 每次都要填写</label><button type="button" id="insert-field">添加到正文</button><h3>引用已有内容</h3><label for="reference-kind">选择内容</label><select id="reference-kind"><option value="latest">最新报告</option><option value="ticker">某证券的最新报告</option><option value="tag">某标签的最新报告</option><option value="specific">指定报告</option><option value="position">按先后位置选择</option><option value="all">全部报告列表</option><option value="inputs">本次填写的信息</option></select><div id="reference-filter" hidden><label for="reference-value">筛选文字</label><input id="reference-value"><label for="reference-input">或使用本次填写的信息</label><select id="reference-input"><option value="">使用上方文字</option></select></div><div id="reference-report" hidden><label for="placeholder">选择报告</label><select id="placeholder"></select></div><div id="reference-position" hidden><label for="reference-number">第几份（最新优先）</label><input id="reference-number" type="number" min="1" value="1"></div><div id="reference-part"><label for="reference-field">引用部分</label><select id="reference-field"><option value="content">正文</option><option value="name">名称</option><option value="created_at">创建日期</option><option value="">摘要</option></select></div><button type="button" id="insert-reference">加入正文</button><p class="meta">引用内容改变后，需要重新预览并核对。</p></aside></div></form>
<div id="using" hidden><h2 id="format-title"></h2><p class="muted">填写本次业务信息，预览后生成新的报告。刷新或关闭前，请先生成报告以保存本次内容。</p><form id="use-form"><div id="inputs"></div><div class="actions"><button class="primary">预览报告</button><button type="button" id="generate" disabled>生成报告</button></div></form><div id="diagnostics" role="status"></div><p id="generation-help" class="meta"></p><article id="preview" aria-label="报告预览" hidden></article></div>
</section></div></main></fieldset>
<script src="/assets/authoring.js"></script>
<script src="/assets/app.js"></script></body></html>
