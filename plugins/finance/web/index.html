<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance · SignalDeck</title>
<style>
:root{color-scheme:light;--ink:#142334;--muted:#637281;--line:#dce3e8;--bg:#f5f7f8;--green:#1c6552}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:white;border-bottom:1px solid var(--line)}header strong{font-size:20px;letter-spacing:-.6px}header span{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}main{max-width:1400px;margin:40px auto;padding:0 32px}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:28px}h1{font-size:36px;letter-spacing:-1.2px;font-weight:550;margin:0}p{color:var(--muted);margin:8px 0}button{cursor:pointer;font:inherit;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:9px 15px}button:hover{border-color:var(--green)}button.primary{background:var(--green);border-color:var(--green);color:white}button:disabled{cursor:default;opacity:.5}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:24px}.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:12px 2px}.tabs button[aria-selected=true]{border-color:var(--green);color:var(--green);font-weight:650}.workspace{display:grid;grid-template-columns:320px 1fr;gap:24px;min-height:580px}.panel{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.search{padding:18px;border-bottom:1px solid var(--line)}input,textarea{font:inherit;width:100%;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;background:white}input:focus,textarea:focus{outline:2px solid #a4ccbe;outline-offset:1px}.entry{display:block;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;width:100%;padding:17px 20px}.entry.active{background:#eaf3ef;border-left:3px solid var(--green)}.entry strong{display:block;overflow-wrap:anywhere}.entry small{color:var(--muted)}.editor{padding:26px}.editor-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.editor-top h2{font-size:20px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:20px 0 7px;color:var(--muted);font-size:13px}textarea{resize:vertical;min-height:320px;font:14px/1.7 ui-monospace,monospace}.meta{font-size:12px;color:var(--muted);margin-top:12px}.empty{padding:48px 24px;color:var(--muted);text-align:center}.message{min-height:26px;color:var(--green);margin-bottom:10px}.message.error{color:#a83d38}dialog{border:1px solid var(--line);border-radius:12px;width:min(720px,90vw);padding:28px}dialog::backdrop{background:#15233155}dialog h2{margin-top:0}.input-row{display:flex;gap:12px;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:50vh;overflow:auto;background:var(--bg);padding:16px;border-radius:6px}.danger{color:#a83d38}@media(max-width:800px){header{padding:0 22px}main{padding:0 18px;margin-top:25px}.workspace{grid-template-columns:1fr}.list-panel{max-height:300px}.editor-top{align-items:start;flex-direction:column}h1{font-size:28px}}
</style></head><body>
<header><strong>SignalDeck <span> / Finance</span></strong><span>Research workspace</span></header>
<main><div class="intro"><div><h1>Templates & reports</h1><p>Turn research into repeatable, traceable reports.</p></div><button class="primary" id="new">New template</button></div>
<nav class="tabs" role="tablist" aria-label="Finance content"><button role="tab" aria-selected="true" data-tab="templates">Templates</button><button role="tab" aria-selected="false" data-tab="reports">Reports</button></nav>
<div id="message" class="message" role="status" aria-live="polite"></div>
<div class="workspace"><section class="panel list-panel" aria-label="Saved content"><div class="search"><input id="search" type="search" placeholder="Find a template…" aria-label="Search saved content"></div><div id="list"></div></section>
<section class="panel editor"><div id="blank" class="empty">Choose a template or create a new one.</div><form id="editor" hidden><div class="editor-top"><h2 id="editor-heading">New template</h2><div class="actions"><button type="button" id="compile">Compile</button><button type="button" id="download" hidden>Download</button><button type="button" id="delete" class="danger" hidden>Delete</button><button class="primary" id="save">Save</button></div></div><label for="name">Name</label><input id="name" required maxlength="160"><label for="content">Markdown content</label><textarea id="content" required spellcheck="false"></textarea><div class="meta" id="meta"></div></form></section></div>
<div class="actions" style="margin-top:20px"><button id="upload" hidden>Upload Markdown report</button><input id="file" type="file" accept=".md,text/markdown" hidden></div>
</main>
<dialog id="compile-dialog"><h2>Compile template</h2><p>Add the inputs referenced by this template.</p><div id="inputs"></div><button id="add-input">Add input</button><div class="actions" style="margin-top:24px"><button class="primary" id="preview">Preview</button><button id="create-report">Save as report</button><button id="close-dialog">Close</button></div><pre id="compiled" hidden></pre></dialog>
<script>
'use strict';
let tab='templates',items=[],selected=null;const $=id=>document.getElementById(id);
function notice(text,error=false){$('message').textContent=text;$('message').className='message'+(error?' error':'')}
async function api(path,method='GET',body){const response=await fetch('/api/'+path,{method,headers:body instanceof FormData?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:body instanceof FormData?body:JSON.stringify(body)});if(!response.ok){let error;try{error=await response.json()}catch{error={message:'The request could not be completed.'}}throw new Error(error.message)}return response.status===204?null:response.json()}
function run(fn){return async(...args)=>{try{notice('');await fn(...args)}catch(e){notice(e.message,true)}}}
function key(item){return tab==='templates'?item.id:item.slug}
function renderList(){const list=$('list');list.replaceChildren();const filter=$('search').value.toLowerCase();for(const item of items.filter(x=>x.name.toLowerCase().includes(filter))){const button=document.createElement('button');button.className='entry'+(selected&&key(item)===key(selected)?' active':'');const title=document.createElement('strong');title.textContent=item.name;const description=document.createElement('small');description.textContent=(item.source?item.source+' · ':'')+new Date(item.updatedAt).toLocaleDateString();button.append(title,description);button.onclick=()=>edit(item);list.append(button)}if(!list.children.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No '+tab+' found.';list.append(empty)}}
async function load(){items=await api(tab);renderList()}
function edit(item=null){selected=item;$('blank').hidden=true;$('editor').hidden=false;$('name').value=item?.name||'';$('content').value=item?.content||'';$('name').readOnly=tab==='reports'&&!!item;$('content').readOnly=item?.source==='agent';$('save').disabled=item?.source==='agent';$('delete').hidden=!item||item.source==='agent';$('download').hidden=tab!=='reports'||!item;$('compile').hidden=tab!=='templates';$('editor-heading').textContent=(item?'Edit ':'New ')+(tab==='templates'?'template':'report');$('meta').textContent=item?.source==='agent'?'Agent reports preserve the original run output.':tab==='templates'?'Use {{inputs.name}} for inputs and {{reports.latest.content}} for the latest report.':item?'Created '+new Date(item.createdAt).toLocaleString():'';renderList()}
for(const button of document.querySelectorAll('[data-tab]'))button.onclick=run(async()=>{tab=button.dataset.tab;selected=null;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));$('new').textContent='New '+(tab==='templates'?'template':'report');$('search').placeholder='Find a '+(tab==='templates'?'template':'report')+'…';$('editor').hidden=true;$('blank').hidden=false;$('blank').textContent='Choose a '+(tab==='templates'?'template':'report')+' or create a new one.';$('upload').hidden=tab!=='reports';await load()});
$('new').onclick=()=>edit();$('search').oninput=renderList;
$('editor').onsubmit=run(async e=>{e.preventDefault();const data=selected?tab==='templates'?{name:$('name').value,content:$('content').value}:{content:$('content').value}:{name:$('name').value,content:$('content').value};const result=await api(tab+(selected?'/'+encodeURIComponent(key(selected)):''),selected?'PATCH':'POST',data);await load();edit(result);notice('Saved.')});
$('delete').onclick=run(async()=>{if(!selected||!confirm('Delete “'+selected.name+'”?'))return;await api(tab+'/'+encodeURIComponent(key(selected)),'DELETE');selected=null;$('editor').hidden=true;$('blank').hidden=false;await load();notice('Deleted.')});
$('download').onclick=()=>{if(selected)location.href='/api/reports/'+encodeURIComponent(selected.slug)+'/download'};
$('compile').onclick=()=>{$('inputs').replaceChildren();const names=[...$('content').value.matchAll(/inputs\.([A-Za-z_][A-Za-z0-9_]*)/g)].map(m=>m[1]);[...new Set(names)].forEach(addInput);$('compiled').hidden=true;$('compile-dialog').showModal()};
function addInput(name=''){const row=document.createElement('div');row.className='input-row';const key=document.createElement('input'),value=document.createElement('input');key.placeholder='Input name';key.setAttribute('aria-label','Input name');key.value=name;value.placeholder='Value';value.setAttribute('aria-label','Input value');row.append(key,value);$('inputs').append(row)}
$('add-input').onclick=()=>addInput();function inputValues(){return Object.fromEntries([...$('inputs').children].map(row=>[row.children[0].value,row.children[1].value]).filter(([key])=>key))}
$('preview').onclick=run(async()=>{const result=await api('templates/compile','POST',{content:$('content').value,inputs:inputValues()});$('compiled').textContent=result.compiled;$('compiled').hidden=false});
$('create-report').onclick=run(async()=>{if(!selected){throw new Error('Save this template before creating a report.')}await api('reports/compile/'+selected.id,'POST',{inputs:inputValues()});$('compile-dialog').close();notice('Report saved. Open Reports to view it.')});$('close-dialog').onclick=()=>$('compile-dialog').close();
$('upload').onclick=()=>$('file').click();$('file').onchange=run(async()=>{const file=$('file').files[0];if(!file)return;const form=new FormData();form.append('file',file);const report=await api('reports/upload','POST',form);await load();edit(report);notice('Report uploaded.');$('file').value=''});
run(load)();
</script></body></html>
