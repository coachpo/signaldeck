<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告 · Finance · SignalDeck</title>
<style>
:root{color-scheme:light;--ink:#172b3a;--muted:#586877;--line:#dce3e9;--bg:#f4f6f8;--accent:#17664e}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;background:white;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px}main{max-width:1400px;margin:24px auto;padding:0 24px}button,input,textarea,select{font:inherit;color:inherit}button,select,input,textarea{border:1px solid var(--line);border-radius:5px;background:white;padding:8px 11px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:white;border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}nav,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}nav{margin:14px 0}nav button[aria-pressed=true]{background:#e5f0eb;border-color:var(--accent)}.workspace{align-items:start;display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:7px;padding:18px;min-width:0}.list{max-height:64vh;overflow:auto}.entry{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 6px}.entry.active{background:#eaf3ee}.entry strong{display:block;overflow-wrap:anywhere}.muted,small{color:var(--muted)}label{display:block;margin:12px 0 5px}input,textarea{width:100%}textarea{min-height:130px;resize:vertical}#content{min-height:330px;font-family:ui-monospace,monospace}.filters{margin:12px 0}.filters input{width:160px}.message{min-height:28px;color:var(--accent);overflow-wrap:anywhere}.error{color:#a33027}pre,article{white-space:pre-wrap;overflow-wrap:anywhere}article{line-height:1.9}pre{background:var(--bg);padding:12px;font-size:13px}.pager{display:flex;justify-content:space-between;margin-top:12px}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.author-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px}.warning{background:#fff5df;padding:10px;border:1px solid #e3c78a}.empty{padding:30px 6px;color:var(--muted)}@media(max-width:1024px){.author-layout{grid-template-columns:1fr}}@media(max-width:767px){header{padding:12px 16px}main{padding:0 12px;margin:16px auto}.workspace{grid-template-columns:1fr}.list{max-height:240px;overflow:auto}.panel{padding:14px}.filters input{width:calc(50% - 4px)}.filters #search{width:100%}.workspace>section:last-child{grid-row:1}}
</style></head><body>
<fieldset id="workspace" style="margin:0;padding:0;border:0;min-width:0">
<header><strong>SignalDeck / Finance</strong><button id="mode" aria-pressed="false">开启专家模式</button></header>
<main><h1>报告</h1><p class="muted">阅读研究结果，或选择已有格式生成报告。</p><nav aria-label="报告工作区"><button data-tab="reports" aria-pressed="true">历史报告</button><button data-tab="templates" aria-pressed="false">使用已有格式</button><button id="new" hidden>新建格式</button><button id="upload" hidden>上传报告</button><input id="file" type="file" accept=".md,text/markdown" hidden></nav>
<div id="message" class="message" role="status" aria-live="polite"></div>
<form id="filters" class="filters"><input id="search" type="search" aria-label="搜索全部报告或格式" placeholder="搜索名称或正文"><select id="source" aria-label="来源"><option value="">所有来源</option><option value="agent">任务生成</option><option value="compiled">格式生成</option><option value="uploaded">文件上传</option><option value="external">手动创建</option></select><input id="ticker" aria-label="证券代码" placeholder="证券代码"><input id="tag" aria-label="标签" placeholder="标签"><input id="review-type" aria-label="研究类型" placeholder="研究类型"><select id="sort" aria-label="排序"><option value="newest">最新优先</option><option value="oldest">最早优先</option><option value="name">名称排序</option></select><button>查询</button></form>
<div class="workspace"><section class="panel"><div id="list" class="list" aria-label="查询结果"></div><div class="pager"><button id="previous">上一页</button><span id="page" aria-live="polite"></span><button id="next">下一页</button></div></section><section class="panel"><div id="blank" class="empty">选择一份报告阅读，或切换到“使用已有格式”。</div>
<div id="reading" hidden><h2 id="report-title"></h2><div id="report-meta" class="meta"></div><p id="report-missing" class="warning" hidden></p><div class="actions"><button id="download">下载 Markdown</button><button id="edit-report" hidden>编辑报告</button><button id="delete-report" hidden>删除报告</button></div><article id="report-body" aria-label="报告正文"></article><details><summary>来源与技术证据</summary><pre id="provenance"></pre></details></div>
<div id="using" hidden><h2 id="format-title"></h2><p class="muted">填写本次业务信息。预览后生成新的报告。</p><form id="use-form"><div id="inputs"></div><div class="actions"><button class="primary">预览报告</button><button type="button" id="generate" disabled>生成报告</button></div></form><div id="diagnostics" role="status"></div><article id="preview" aria-label="报告预览" hidden></article></div>
<form id="author" style="margin-top:20px" hidden><h2 id="author-title">制作报告格式</h2><div class="author-layout"><div><label for="name">名称</label><input id="name" required maxlength="100"><label for="content">Markdown 内容</label><textarea id="content" required spellcheck="false"></textarea><div class="actions"><button class="primary">保存</button><button type="button" id="author-preview">编译并预览草稿</button><button type="button" id="delete">删除格式</button></div><p id="draft-note" class="meta"></p></div><aside><h3>占位符辅助</h3><label for="field-name">业务字段名（英文）</label><input id="field-name" placeholder="company"><label for="field-label">显示名称</label><input id="field-label" placeholder="公司名称"><label for="field-required"><input style="width:auto" type="checkbox" id="field-required" checked> 必填</label><button type="button" id="insert-field">插入业务字段</button><p class="meta">未声明的 inputs 字段按必填处理。可选字段可以留空。</p><label for="placeholder">报告引用</label><select id="placeholder"><option value="{{reports.latest.content}}">最新报告正文</option><option value="{{reports}}">全部报告列表</option></select><button type="button" id="insert-reference">插入引用</button><p class="meta">动态引用在预览和生成之间发生变化时，需要重新预览。循环、未知引用会显示编译诊断。</p></aside></div></form>
</section></div></main></fieldset>
<script>
'use strict';
const $=id=>document.getElementById(id),size=15,drafts=new Map(),values=new Map();
let tab='reports',expert=false,items=[],selected=null,offset=0,more=false,request=0,previewState=null,reportEditing=false;
const sources={agent:'任务生成',compiled:'格式生成',uploaded:'文件上传',external:'手动创建'};
function notice(message,error=false){$('message').textContent=message;$('message').className='message'+(error?' error':'')}
async function api(path,method='GET',body){const response=await fetch('/api/'+path,{method,headers:body instanceof FormData?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:body instanceof FormData?body:JSON.stringify(body)});if(!response.ok){let error;try{error=await response.json()}catch{error={message:'Finance 服务暂时不可用，请重试。'}}throw new Error(error.message||'请求失败');}return response.status===204?null:response.json()}
function run(fn){return async(...args)=>{try{notice('');await fn(...args)}catch(error){notice(error.message,true)}}}
let writing=false;
// Keep a write bound to the selected object and submitted draft until it settles.
function mutation(fn){return run(async(...args)=>{if(writing)return;writing=true;$('workspace').disabled=true;$('workspace').setAttribute('aria-busy','true');notice('正在处理，请稍候…');try{await fn(...args)}finally{writing=false;$('workspace').disabled=false;$('workspace').removeAttribute('aria-busy');if($('message').textContent==='正在处理，请稍候…')notice('')}})}
function identity(){return tab+':'+(selected?.id??'new')}
function remember(){if(!$('author').hidden){const draft={name:$('name').value,content:$('content').value};if(selected&&draft.name===selected.name&&draft.content===selected.content)drafts.delete(identity());else drafts.set(identity(),draft);}if(!$('using').hidden)values.set(identity(),{...(values.get(identity())||{}),...inputValues()})}
function renderMarkdown(target,text){target.replaceChildren();let code=null;for(const line of text.split('\n')){if(line.startsWith('```')){if(code){target.append(code);code=null}else code=document.createElement('pre');continue}if(code){code.textContent+=line+'\n';continue}const heading=line.match(/^(#{1,6})\s+(.*)$/),el=document.createElement(heading?'h'+heading[1].length:'p');const body=heading?heading[2]:line;let last=0;for(const match of body.matchAll(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g)){el.append(document.createTextNode(body.slice(last,match.index)));const a=document.createElement('a');a.textContent=match[1];a.href=match[2];a.target='_blank';a.rel='noopener noreferrer';el.append(a);last=match.index+match[0].length}el.append(document.createTextNode(body.slice(last)));target.append(el)}if(code)target.append(code)}
function content(){return expert&&tab==='templates'?$('content').value:selected?.content||''}
function invalidate(){previewState=null;$('generate').disabled=true;$('preview').hidden=true;$('diagnostics').replaceChildren();$('diagnostics').className=''}
function fields(text){const declared=new Map([...text.matchAll(/<!--\s*input: ([A-Za-z_][A-Za-z0-9_]*)\s*\|\s*([^|\n]+?)\s*\|\s*(required|optional)\s*-->/g)].map(m=>[m[1],{name:m[1],label:m[2],required:m[3]==='required'}]));const names=[...declared.keys(),...[...text.matchAll(/\binputs\.([A-Za-z_][A-Za-z0-9_]*)/g)].map(m=>m[1])];return [...new Set(names)].map(name=>declared.get(name)||{name,label:({ticker:'证券代码',company:'公司名称',topic:'研究主题',notes:'补充说明',summary:'摘要'})[name]||name,required:true})}
function inputValues(){return Object.fromEntries([...$('inputs').querySelectorAll('[data-input]')].map(el=>[el.dataset.input,el.value]))}
function renderInputs(){const saved=values.get(identity())||{};$('inputs').replaceChildren();for(const field of fields(content())){const label=document.createElement('label'),input=document.createElement('textarea');input.id='input-'+field.name;input.dataset.input=field.name;input.required=field.required;input.value=saved[field.name]||'';input.rows=2;input.style.minHeight="72px";label.htmlFor=input.id;label.textContent=field.label+(field.required?'（必填）':'（可选）');input.oninput=()=>{values.set(identity(),{...(values.get(identity())||{}),...inputValues()});invalidate()};$('inputs').append(label,input)}if(!$('inputs').children.length){const p=document.createElement('p');p.textContent='此格式无需填写业务信息。';$('inputs').append(p)}}
function renderList(){const list=$('list');list.replaceChildren();for(const item of items){const button=document.createElement('button');button.className='entry'+(selected?.id===item.id?' active':'');const title=document.createElement('strong'),meta=document.createElement('small');title.textContent=item.name;meta.textContent=(sources[item.source]||'报告格式')+' · '+new Date(item.createdAt).toLocaleString();button.append(title,meta);button.onclick=()=>{remember();selected=item;reportEditing=false;invalidate();show();if(tab==='reports')history.replaceState(null,'','?report='+encodeURIComponent(item.slug))};list.append(button)}if(!items.length)list.textContent='没有符合条件的内容。';$('previous').disabled=offset===0;$('next').disabled=!more;$('page').textContent='第 '+(offset/size+1)+' 页'}
async function load(){const ticket=++request;let rows;if(tab==='reports'){const params=new URLSearchParams({limit:String(size+1),offset:String(offset),sort:$('sort').value});for(const [name,id] of [['q','search'],['source','source'],['ticker','ticker'],['tag','tag'],['reviewType','review-type']])if($(id).value)params.set(name,$(id).value);rows=await api('reports?'+params)}else{rows=await api('templates');const query=$('search').value.toLowerCase();rows=rows.filter(x=>(x.name+' '+x.content).toLowerCase().includes(query));rows.sort((a,b)=>$('sort').value==='name'?a.name.localeCompare(b.name):$('sort').value==='oldest'?a.id-b.id:b.id-a.id);rows=rows.slice(offset,offset+size+1)}if(ticket!==request)return;more=rows.length>size;items=rows.slice(0,size);renderList()}
function show(){for(const id of ['reading','using','author'])$(id).hidden=true;$('blank').hidden=!!selected||(expert&&drafts.has(identity()));$('new').hidden=!expert;$('new').textContent=tab==='templates'?'新建格式':'新建报告';$('upload').hidden=!(expert&&tab==='reports');$('mode').textContent=expert?'切换普通模式':'开启专家模式';$('mode').setAttribute('aria-pressed',String(expert));for(const id of ['source','ticker','tag','review-type'])$(id).hidden=tab!=='reports';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));if(!selected&&!drafts.has(identity()))return;
if(tab==='reports'&&!reportEditing&&selected){$('reading').hidden=false;$('report-title').textContent=selected.name;renderMarkdown($('report-body'),selected.content);$('report-meta').textContent=(sources[selected.source]||selected.source)+' · 创建 '+new Date(selected.createdAt).toLocaleString()+' · 更新 '+new Date(selected.updatedAt).toLocaleString();$('provenance').textContent=JSON.stringify({source:selected.source,createdAt:selected.createdAt,metadata:selected.metadata},null,2);const missing=selected.content.match(/\[(?:Missing|Unknown|Invalid|Circular)[^\]]*\]/g)||[];$('report-missing').hidden=!missing.length;$('report-missing').textContent='此报告包含未解析内容：'+missing.join('；');$('edit-report').hidden=!expert||selected.source==='agent';$('delete-report').hidden=!expert||selected.source==='agent';
}else if(expert){$('author').hidden=false;const draft=drafts.get(identity())||selected||{name:'',content:''};$('name').value=draft.name;$('content').value=draft.content;$('name').readOnly=tab==='reports'&&!!selected;$('name').maxLength=tab==='reports'?200:100;$('author-title').textContent=tab==='templates'?'制作报告格式':'编辑报告';$('delete').hidden=!selected||tab!=='templates';$('author-preview').hidden=tab!=='templates';document.querySelector('aside').hidden=tab!=='templates';$('draft-note').textContent='模式切换保留本页草稿；保存后才更新已有格式。关闭本页前请保存。';if(tab==='templates'){$('using').hidden=false;$('format-title').textContent='草稿预览';renderInputs()}
}else if(selected){$('using').hidden=false;$('format-title').textContent=selected.name;renderInputs()}else{$('blank').hidden=false;$('blank').textContent='有一份未保存的专家草稿。切回专家模式继续制作。'}renderList()}
$('mode').onclick=()=>{remember();expert=!expert;reportEditing=false;invalidate();show()};
for(const button of document.querySelectorAll('[data-tab]'))button.onclick=run(async()=>{remember();tab=button.dataset.tab;selected=null;offset=0;reportEditing=false;invalidate();history.replaceState(null,'',location.pathname);show();await load()});
$('filters').onsubmit=run(async event=>{event.preventDefault();offset=0;await load()});$('previous').onclick=run(async()=>{offset=Math.max(0,offset-size);await load()});$('next').onclick=run(async()=>{offset+=size;await load()});
$('new').onclick=()=>{remember();selected=null;reportEditing=true;drafts.set(identity(),drafts.get(identity())||{name:'',content:''});invalidate();show()};$('name').oninput=remember;$('content').oninput=()=>{remember();values.set(identity(),{...(values.get(identity())||{}),...inputValues()});invalidate();renderInputs()};
async function preview(){if(!$('use-form').reportValidity())return;const source=content(),inputs=inputValues();const result=await api('templates/compile','POST',{content:source,inputs});if(source!==content()||JSON.stringify(inputs)!==JSON.stringify(inputValues()))return;renderMarkdown($('preview'),result.compiled);$('preview').hidden=false;const errors=result.compiled.match(/\[(?:Missing|Unknown|Invalid|Circular)[^\]]*\]/g)||[];$('diagnostics').className=errors.length?'warning':'';$('diagnostics').textContent=errors.length?'编译问题：'+errors.join('；'):'预览已更新。';previewState={source,inputs,compiled:result.compiled};$('generate').disabled=errors.length>0||!selected||source!==selected.content;}
$('use-form').onsubmit=run(async e=>{e.preventDefault();await preview()});$('author-preview').onclick=run(preview);
$('generate').onclick=mutation(async()=>{if(!previewState||!selected)return;const state=previewState;$('generate').disabled=true;try{const report=await api('reports/compile/'+selected.id,'POST',{inputs:state.inputs,expectedContent:state.source,expectedCompiled:state.compiled});remember();tab='reports';selected=report;reportEditing=false;offset=0;invalidate();show();await load();history.replaceState(null,'','?report='+encodeURIComponent(report.slug));notice('报告已生成并保存。')}catch(error){invalidate();throw error}});
$('author').onsubmit=mutation(async event=>{event.preventDefault();const body=selected&&tab==='reports'?{content:$('content').value}:{name:$('name').value,content:$('content').value};const old=identity();const result=await api(tab+(selected?'/'+encodeURIComponent(tab==='reports'?selected.slug:selected.id):''),selected?'PATCH':'POST',body);const savedValues=values.get(old);drafts.delete(old);selected=result;if(savedValues)values.set(identity(),savedValues);reportEditing=false;invalidate();await load();show();notice('已保存。')});
$('edit-report').onclick=()=>{reportEditing=true;show()};async function remove(){if(!selected||!confirm('删除“'+selected.name+'”？'))return;await api(tab+'/'+encodeURIComponent(tab==='reports'?selected.slug:selected.id),'DELETE');drafts.delete(identity());selected=null;show();await load();notice('已删除。')}$('delete').onclick=mutation(remove);$('delete-report').onclick=mutation(remove);
$('download').onclick=()=>{if(selected)location.href='/api/reports/'+encodeURIComponent(selected.slug)+'/download'};
function insert(text){const el=$('content');el.setRangeText(text,el.selectionStart,el.selectionEnd,'end');el.dispatchEvent(new Event('input'));el.focus()}
$('insert-field').onclick=run(async()=>{const name=$('field-name').value.trim(),label=$('field-label').value.trim();if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)||!label||/[|\n<>]/.test(label))throw new Error('填写英文字段名和不含 |、换行或尖括号的显示名称。');insert('<!-- input: '+name+' | '+label+' | '+($('field-required').checked?'required':'optional')+' -->\n{{inputs.'+name+'}}')});$('insert-reference').onclick=()=>insert($('placeholder').value);
$('upload').onclick=()=>$('file').click();$('file').onchange=mutation(async()=>{const file=$('file').files[0];if(!file)return;const form=new FormData();form.append('file',file);selected=await api('reports/upload','POST',form);reportEditing=false;await load();show();$('file').value='';notice('报告已上传。')});
window.addEventListener('beforeunload',event=>{remember();if([...drafts.values()].some(draft=>draft.name||draft.content)){event.preventDefault();event.returnValue=''}});
run(async()=>{const params=new URLSearchParams(location.search),slug=params.get('report'),reportId=params.get('reportId');if(slug||reportId){selected=await api(slug?'reports/'+encodeURIComponent(slug):'reports/by-id/'+encodeURIComponent(reportId));show()}await load();const tree=await api('templates/placeholders');for(const report of tree.reports){if(!/^[^.]+$/.test(report.name))continue;const option=document.createElement('option');option.value='{{reports.'+report.name+'.content}}';option.textContent=report.name;$('placeholder').append(option)}})();
</script></body></html>
