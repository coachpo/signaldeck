name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify release version surfaces
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          root = pathlib.Path('.')
          project = tomllib.loads((root / 'backend' / 'pyproject.toml').read_text(encoding='utf-8'))['project']
          lock = tomllib.loads((root / 'backend' / 'uv.lock').read_text(encoding='utf-8'))
          locked = [item['version'] for item in lock['package'] if item['name'] == project['name']]
          surfaces = {
              'VERSION': (root / 'VERSION').read_text(encoding='utf-8').strip(),
              'backend/VERSION': (root / 'backend' / 'VERSION').read_text(encoding='utf-8').strip(),
              'backend/pyproject.toml': project['version'],
              'backend/uv.lock': locked[0] if len(locked) == 1 else None,
              'frontend/VERSION': (root / 'frontend' / 'VERSION').read_text(encoding='utf-8').strip(),
              'frontend/package.json': json.loads((root / 'frontend' / 'package.json').read_text(encoding='utf-8'))['version'],
          }

          if len(set(surfaces.values())) != 1:
              for name, version in surfaces.items():
                  print(f'{name}: {version}', file=sys.stderr)
              print('release version surfaces are not aligned; use release.sh', file=sys.stderr)
              raise SystemExit(1)

          print(f'release version surfaces OK: {surfaces["VERSION"]}')
          PY

      - name: Validate deployment configuration
        run: |
          python3 -m unittest discover -s docker -p 'test_*.py'
          python3 -m unittest discover -s frontend/gateway -p 'test_*.py'
          for tests in .agents/skills/*/scripts/tests; do
            python3 -m unittest discover -s "$tests" -p 'test_*.py'
          done

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+psycopg://signaldeck:signaldeck@127.0.0.1:25432/signaldeck
      TEST_DATABASE_URL: postgresql+psycopg://signaldeck:signaldeck@127.0.0.1:25432/signaldeck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: signaldeck
          POSTGRES_USER: signaldeck
          POSTGRES_PASSWORD: signaldeck
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U signaldeck -d signaldeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.7"
          python-version: "3.13.13"

      - name: Install durable execution prerequisites
        run: |
          uv python install 3.13.13
          bash .github/scripts/install-temporal-cli.sh

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up pnpm for plugin browser regression
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js for plugin browser regression
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install plugin browser regression dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run backend quality checks
        working-directory: backend
        run: |
          uv run ruff check app tests
          uv run black --check app tests
          uv run isort --check-only app tests
          uv run mypy app
          uv run pytest

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend quality checks
        working-directory: frontend
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test:run

  container-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Resolve short git revision
        id: rev
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: signaldeck:ci
          load: true
          build-args: |
            VITE_GIT_RUN_NUMBER=${{ github.run_number }}
            VITE_GIT_REVISION=${{ steps.rev.outputs.short }}
          cache-from: type=gha,scope=ci-app
          cache-to: type=gha,scope=ci-app,mode=max

      - name: Build Finance plugin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./plugins/finance/Dockerfile
          tags: signaldeck-finance:ci
          load: true
          cache-from: type=gha,scope=ci-finance
          cache-to: type=gha,scope=ci-finance,mode=max

      - name: Build Notes plugin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./plugins/notes/Dockerfile
          tags: signaldeck-notes:ci
          load: true
          cache-from: type=gha,scope=ci-notes
          cache-to: type=gha,scope=ci-notes,mode=max

      - name: Build Digital Oracle plugin image
        uses: docker/build-push-action@v7
        with:
          context: ./plugins
          file: ./plugins/digital_oracle/Dockerfile
          tags: signaldeck-digital-oracle:ci
          load: true
          cache-from: type=gha,scope=ci-digital-oracle
          cache-to: type=gha,scope=ci-digital-oracle,mode=max

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.7"
          python-version: "3.13.13"

      - name: Install verifier dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Verify the single-host deployment bundle
        run: |
          backend/.venv/bin/python docker/verify_deployment.py \
            --app-image signaldeck:ci \
            --notes-image signaldeck-notes:ci \
            --finance-image signaldeck-finance:ci \
            --oracle-image signaldeck-digital-oracle:ci

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.71.0
          cache: true

      - name: Scan built images with Trivy (non-blocking evidence)
        shell: bash
        run: |
          mkdir -p trivy-reports
          {
            echo "### Container vulnerability scan evidence"
            echo ""
            echo "Trivy scans are non-blocking. Reports are uploaded as artifacts; HIGH/CRITICAL, fixed-only."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for image in signaldeck signaldeck-finance signaldeck-notes signaldeck-digital-oracle; do
            status=0
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format sarif --output "trivy-reports/$image.sarif" "$image:ci" || status=$?
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table --output "trivy-reports/$image.txt" "$image:ci" || status=$?
            echo "- \`$image:ci\`: Trivy status \`$status\`" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      - name: Upload Trivy scan artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-local-image-reports
          path: trivy-reports/
          if-no-files-found: warn
          retention-days: 14

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [version-sync, backend-quality, frontend-quality]
    env:
      DATABASE_URL: postgresql+psycopg://signaldeck:signaldeck@127.0.0.1:25432/signaldeck
      TEST_DATABASE_URL: postgresql+psycopg://signaldeck:signaldeck@127.0.0.1:25432/signaldeck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: signaldeck
          POSTGRES_USER: signaldeck
          POSTGRES_PASSWORD: signaldeck
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U signaldeck -d signaldeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.7"
          python-version: "3.13.13"

      - name: Install durable execution prerequisites
        run: |
          uv python install 3.13.13
          bash .github/scripts/install-temporal-cli.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies for E2E
        working-directory: backend
        run: uv sync --frozen

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run frontend E2E tests
        working-directory: frontend
        run: pnpm test:e2e
