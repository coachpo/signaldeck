name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify backend and frontend version sync
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          root = pathlib.Path('.')
          backend_version = (root / 'backend' / 'VERSION').read_text(encoding='utf-8').strip()
          frontend_version = (root / 'frontend' / 'VERSION').read_text(encoding='utf-8').strip()
          pyproject_version = tomllib.loads((root / 'backend' / 'pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          package_version = json.loads((root / 'frontend' / 'package.json').read_text(encoding='utf-8'))['version']

          if backend_version != pyproject_version:
              print(f'backend version mismatch: VERSION={backend_version} pyproject={pyproject_version}', file=sys.stderr)
              raise SystemExit(1)

          if frontend_version != package_version:
              print(f'frontend version mismatch: VERSION={frontend_version} package.json={package_version}', file=sys.stderr)
              raise SystemExit(1)

          print(f'backend version OK: {backend_version}')
          print(f'frontend version OK: {frontend_version}')
          PY

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+psycopg://signaldeck:signaldeck@127.0.0.1:25432/signaldeck
      TEST_DATABASE_URL: postgresql+psycopg://signaldeck:signaldeck@127.0.0.1:25432/signaldeck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: signaldeck
          POSTGRES_USER: signaldeck
          POSTGRES_PASSWORD: signaldeck
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U signaldeck -d signaldeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.7"
          python-version: "3.13.13"

      - name: Install durable execution prerequisites
        run: |
          uv python install 3.13.13
          bash .github/scripts/install-temporal-cli.sh

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up pnpm for plugin browser regression
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js for plugin browser regression
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install plugin browser regression dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run backend quality checks
        working-directory: backend
        run: |
          uv run ruff check app tests
          uv run black --check app tests
          uv run isort --check-only app tests
          uv run mypy app
          uv run pytest

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend quality checks
        working-directory: frontend
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test:run

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [version-sync, backend-quality, frontend-quality]
    env:
      DATABASE_URL: postgresql+psycopg://signaldeck:signaldeck@127.0.0.1:25432/signaldeck
      TEST_DATABASE_URL: postgresql+psycopg://signaldeck:signaldeck@127.0.0.1:25432/signaldeck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: signaldeck
          POSTGRES_USER: signaldeck
          POSTGRES_PASSWORD: signaldeck
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U signaldeck -d signaldeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.7"
          python-version: "3.13.13"

      - name: Install durable execution prerequisites
        run: |
          uv python install 3.13.13
          bash .github/scripts/install-temporal-cli.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies for E2E
        working-directory: backend
        run: uv sync --frozen

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run frontend E2E tests
        working-directory: frontend
        run: pnpm test:e2e
