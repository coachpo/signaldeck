name: Cleanup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Container package versions are never pruned here. Earlier multi-platform images
# with attestations keep their per-platform manifests untagged; deleting untagged
# versions would break the pinned plugin and rollback images that deployments pull.
jobs:
  cleanup-workflow-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keep a week of runs so a release's CI and image evidence stays available
      # while its release manifest is written or recovered.
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          retain_days: 7
          keep_minimum_runs: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
