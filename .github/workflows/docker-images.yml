name: Docker Images

# Images are published only from release tags created by release.sh, after CI is
# green on the tagged commit. Manual runs publish manual-<sha> tags only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      service:
        description: Select service to build
        type: choice
        required: true
        default: all
        options:
          - all
          - app
          - finance
          - notes
          - digital-oracle

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BUILD_PLATFORM: linux/arm64

jobs:
  verify-ci:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 80); do
            conclusion=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --json status,conclusion \
              --jq 'first | if .status == "completed" then .conclusion else "pending" end' 2>/dev/null || echo "none")
            case "$conclusion" in
              success)
                echo "CI is green for $GITHUB_SHA"
                exit 0
                ;;
              pending|none|null)
                echo "CI for $GITHUB_SHA not finished yet (state: $conclusion), attempt $attempt/80"
                sleep 30
                ;;
              *)
                echo "CI concluded '$conclusion' for $GITHUB_SHA — refusing to publish images"
                exit 1
                ;;
            esac
          done
          echo "Timed out waiting for CI on $GITHUB_SHA"
          exit 1

  build-and-push:
    needs: verify-ci
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.verify-ci.result == 'success') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.service != 'all' && format('["{0}"]', inputs.service) || '["app","finance","notes","digital-oracle"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve build target
        id: target
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          case "$SERVICE" in
            app)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "file=./Dockerfile" >> "$GITHUB_OUTPUT"
              echo "image=signaldeck" >> "$GITHUB_OUTPUT"
              ;;
            finance|notes)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "file=./plugins/$SERVICE/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "image=signaldeck-$SERVICE" >> "$GITHUB_OUTPUT"
              ;;
            digital-oracle)
              echo "context=./plugins" >> "$GITHUB_OUTPUT"
              echo "file=./plugins/digital_oracle/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "image=signaldeck-$SERVICE" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported service: $SERVICE" >&2
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.target.outputs.image }}
          tags: |
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=sha,format=long,enable=${{ github.event_name == 'push' }}
            type=sha,format=long,prefix=manual-,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

      - name: Resolve frontend build metadata
        id: frontend_build_metadata
        if: matrix.service == 'app'
        run: |
          echo "git_revision=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "git_run_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # Single-platform images without attestations keep one plain manifest per tag,
      # so the release manifest can pin and verify one digest per image.
      - name: Build and push Docker image (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ steps.target.outputs.context }}
          file: ${{ steps.target.outputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GIT_RUN_NUMBER=${{ steps.frontend_build_metadata.outputs.git_run_number }}
            VITE_GIT_REVISION=${{ steps.frontend_build_metadata.outputs.git_revision }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
          cache-to: |
            type=gha,scope=${{ matrix.service }},mode=max
          platforms: ${{ env.BUILD_PLATFORM }}
          provenance: false
          sbom: false
