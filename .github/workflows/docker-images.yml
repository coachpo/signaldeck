name: Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'backend'
      - 'backend/**'
      - 'frontend'
      - 'frontend/**'
      - 'plugins/**'
      - '.dockerignore'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:
    inputs:
      service:
        description: Select service to build
        type: choice
        required: true
        default: all
        options:
          - all
          - app
          - finance
          - notes
          - digital-oracle

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BUILD_PLATFORM: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.service != 'all' && format('["{0}"]', inputs.service) || '["app","finance","notes","digital-oracle"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve build target
        id: target
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          case "$SERVICE" in
            app)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "file=./Dockerfile" >> "$GITHUB_OUTPUT"
              echo "image=signaldeck" >> "$GITHUB_OUTPUT"
              ;;
            finance|notes)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "file=./plugins/$SERVICE/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "image=signaldeck-$SERVICE" >> "$GITHUB_OUTPUT"
              ;;
            digital-oracle)
              echo "context=./plugins" >> "$GITHUB_OUTPUT"
              echo "file=./plugins/digital_oracle/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "image=signaldeck-$SERVICE" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported service: $SERVICE" >&2
              exit 1
              ;;
          esac

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.target.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve frontend build metadata
        id: frontend_build_metadata
        if: matrix.service == 'app'
        run: |
          echo "git_revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_run_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ steps.target.outputs.context }}
          file: ${{ steps.target.outputs.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GIT_RUN_NUMBER=${{ github.run_number }}
            VITE_GIT_REVISION=${{ steps.frontend_build_metadata.outputs.git_revision }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
          cache-to: |
            type=gha,scope=${{ matrix.service }},mode=max
          platforms: ${{ env.BUILD_PLATFORM }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
