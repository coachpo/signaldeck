version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # FastAPI stays <0.137; see "FastAPI 版本上限" in CONTRIBUTING.md.
      - dependency-name: fastapi
        versions: [">=0.137"]

  - package-ecosystem: uv
    directories:
      - /plugins/digital_oracle
      - /plugins/finance
      - /plugins/notes
    schedule:
      interval: weekly
    groups:
      plugins-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Plugin code is tested only in the backend environment; keep FastAPI in step.
      - dependency-name: fastapi
        versions: [">=0.137"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /plugins/digital_oracle
      - /plugins/finance
      - /plugins/notes
    schedule:
      interval: weekly
