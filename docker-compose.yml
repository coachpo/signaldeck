# Local/demo SD-TARGET-001 stack. Dedicated host data never reuses legacy volumes.
x-core-environment: &core-environment
  SIGNALDECK_RUNTIME_MODE: local
  SIGNALDECK_CONNECTION_PRESETS_FILE: /etc/signaldeck/connection-presets.json
  DATABASE_URL: postgresql+psycopg://signaldeck_core:${CORE_DB_PASSWORD:-core-local-password}@db:5432/signaldeck_core
  AGENT_PLATFORM_ENCRYPTION_KEY: ${AGENT_PLATFORM_ENCRYPTION_KEY:-signaldeck-agent-platform-dev-key}
  SIGNALDECK_API_TOKEN: ${SIGNALDECK_API_TOKEN:-}
  SIGNALDECK_ARTIFACT_DIR: /data/artifacts
  SIGNALDECK_CORE_ARTIFACT_DIR: /data/core
  SIGNALDECK_CORE_ENV_DIR: /data/core-environments
  SIGNALDECK_CORE_PYTHON_VERSION: "3.13.13"
  TEMPORAL_ADDRESS: temporal:7233
  UV_CACHE_DIR: /data/uv-cache

x-core-volumes: &core-volumes
  - type: bind
    source: ${SIGNALDECK_WORKFLOW_DATA_SOURCE:-./demo}
    target: /opt/signaldeck/workflows
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ${SIGNALDECK_CONNECTION_PRESETS_FILE:-./docker/connection-presets.local.json}
    target: /etc/signaldeck/connection-presets.json
    read_only: true
    bind:
      create_host_path: false
  - ${SIGNALDECK_DATA_DIR:-./.signaldeck-target}/artifacts:/data/artifacts
  - ${SIGNALDECK_DATA_DIR:-./.signaldeck-target}/core:/data/core
  - ${SIGNALDECK_DATA_DIR:-./.signaldeck-target}/core-environments:/data/core-environments
  - ${SIGNALDECK_DATA_DIR:-./.signaldeck-target}/uv-cache:/data/uv-cache

services:
  db:
    restart: unless-stopped
    image: postgres:16.15-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    environment:
      POSTGRES_USER: signaldeck_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bootstrap-local-password}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:-core-local-password}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:-finance-local-password}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD:-notes-local-password}
    volumes:
      - ${SIGNALDECK_DATA_DIR:-./.signaldeck-target}/postgres:/var/lib/postgresql/data
      - ./docker/init-target-databases.sh:/docker-entrypoint-initdb.d/10-target-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U signaldeck_bootstrap -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal:
    restart: unless-stopped
    user: "${SIGNALDECK_LOCAL_UID:-1000}:${SIGNALDECK_LOCAL_GID:-1000}"
    environment:
      HOME: /home/temporal
      USER: temporal
    image: temporalio/temporal:1.8.3@sha256:cea463d98a8d6def4420f903ea5c3fcd0d85c8d10fbcc2770a50c12fff2eb26d
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/target.db", "--ui-disable-news-fetch"]
    volumes:
      - ${SIGNALDECK_DATA_DIR:-./.signaldeck-target}/temporal:/home/temporal
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: ${SIGNALDECK_LOCAL_IMAGE_PREFIX:-signaldeck-target}-app:local
    labels:
      io.signaldeck.support: local-demo-only
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *core-environment
      SIGNALDECK_ROOT_IMAGE_SCOPE: local-demo-only
      SIGNALDECK_WORKFLOW_DATA_DIR: ${SIGNALDECK_WORKFLOW_DATA_DIR-/opt/signaldeck/workflows}
      PUBLIC_BASE_URL: http://localhost:${APP_PORT:-8080}
      CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080},http://127.0.0.1:${APP_PORT:-8080}
      BACKEND_PORT: "8000"
      PORT: "8080"
    volumes: *core-volumes
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  dispatcher:
    restart: unless-stopped
    image: ${SIGNALDECK_LOCAL_IMAGE_PREFIX:-signaldeck-target}-app:local
    entrypoint: ["python", "-m", "app.workers.command_dispatcher"]
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment: *core-environment
    volumes: *core-volumes
    healthcheck:
      disable: true
    stop_grace_period: 20s

  worker:
    restart: unless-stopped
    image: ${SIGNALDECK_LOCAL_IMAGE_PREFIX:-signaldeck-target}-app:local
    entrypoint: ["python", "-m", "app.workers.artifact_worker", "--serve"]
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment: *core-environment
    volumes: *core-volumes
    healthcheck:
      disable: true
    stop_grace_period: 30s

  finance:
    restart: unless-stopped
    profiles: ["finance"]
    build:
      context: ./plugins
      dockerfile: finance/Dockerfile
    image: ${SIGNALDECK_LOCAL_IMAGE_PREFIX:-signaldeck-target}-finance:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      PLUGIN_DATABASE_URL: postgresql+psycopg://signaldeck_finance:${FINANCE_DB_PASSWORD:-finance-local-password}@db:5432/signaldeck_finance
      PLUGIN_ENDPOINT: http://finance:8000/mcp/
      PLUGIN_PAGE_URL: http://localhost:${FINANCE_PORT:-8091}/
    ports:
      - "127.0.0.1:${FINANCE_PORT:-8091}:8000"

  digital-oracle:
    restart: unless-stopped
    profiles: ["digital-oracle"]
    build:
      context: ./plugins
      dockerfile: digital_oracle/Dockerfile
    image: ${SIGNALDECK_LOCAL_IMAGE_PREFIX:-signaldeck-target}-digital-oracle:local
    environment:
      PLUGIN_ENDPOINT: http://digital-oracle:8000/mcp/
      FRED_API_KEY: ${FRED_API_KEY:-}
      EDGAR_CONTACT_EMAIL: ${EDGAR_CONTACT_EMAIL:-}

  notes:
    restart: unless-stopped
    profiles: ["notes"]
    build:
      context: ./plugins
      dockerfile: notes/Dockerfile
    image: ${SIGNALDECK_LOCAL_IMAGE_PREFIX:-signaldeck-target}-notes:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      PLUGIN_DATABASE_URL: postgresql+psycopg://signaldeck_notes:${NOTES_DB_PASSWORD:-notes-local-password}@db:5432/signaldeck_notes
      PLUGIN_ENDPOINT: http://notes:8000/mcp/
      PLUGIN_PAGE_URL: http://localhost:${NOTES_PORT:-8093}/
    ports:
      - "127.0.0.1:${NOTES_PORT:-8093}:8000"

  bootstrap:
    image: ${SIGNALDECK_LOCAL_IMAGE_PREFIX:-signaldeck-target}-app:local
    entrypoint: ["python", "/opt/signaldeck/bootstrap_plugins.py"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      SIGNALDECK_API_URL: http://app:8000/api
      SIGNALDECK_API_TOKEN: ${SIGNALDECK_API_TOKEN:-}
      SIGNALDECK_PLUGINS: ${SIGNALDECK_PLUGINS-finance,digital-oracle,notes}
