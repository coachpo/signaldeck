[project]
name = "signaldeck-backend"
version = "0.1.0"
description = "FastAPI backend for SignalDeck"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  # ponytail: cap <0.137 — FastAPI 0.137 nests include_router routes (_IncludedRouter), which
  # crashes opentelemetry-instrumentation-fastapi <0.64b0 on partial route matches (e.g. 405s);
  # 0.64b0 needs otel-sdk 1.43, blocked by logfire<=4.37 (sdk<1.43). Lift when logfire catches up.
  "fastapi>=0.136.3,<0.137",
  "httpx>=0.27,<1.0",
  "openai==3.8.0",
  "psycopg[binary]>=3.3.4,<4.0",
  "pydantic-settings>=2.14.2,<3.0",
  "python-multipart>=0.0.32,<1.0",
  "ruamel.yaml>=0.19.1,<0.20.0",
  "sqlalchemy>=2.0.51,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "logfire[fastapi]>=4.37.0",
  "cryptography>=43",
  "jsonschema==4.26.0",
  "pydantic-ai-slim[openai,temporal]==2.40.0",
  "mcp==1.26.0",
  "temporalio==1.32.0",
]

[dependency-groups]
dev = [
  "black>=24.8,<25.0",
  "isort>=5.13,<6.0",
  "mypy>=2.2.0,<3.0",
  "pytest>=9.1.1,<10.0",
  "ruff>=0.15.20,<1.0",
  "types-jsonschema==4.26.0.20260518",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["app", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
pretty = true
show_error_codes = true
exclude = ["tests"]
