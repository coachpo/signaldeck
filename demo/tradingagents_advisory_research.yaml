apiVersion: signaldeck.workflowPackage/v2
metadata:
  key: tradingagents_advisory_research
  name: Market advisory research
  description: Collect current quotes, run independent opportunity and risk reviews, and save
    an evidence-based report in Finance.
agents:
  collect_quotes:
    name: Collect fresh market quotes
    inputSchema:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
      required:
      - symbols
      unevaluatedProperties: false
    outputSchema:
      type: object
      properties:
        toolKey:
          const: signaldeck/finance/market_data_quote_lookup
          type: string
        quotes:
          type: array
          items:
            type: object
            properties:
              symbol:
                type: string
              name:
                type: string
              price:
                type: string
              currency:
                type: string
              provider:
                type: string
              asOf:
                type: string
              isStale:
                type: boolean
              previousClose:
                type: string
            required:
            - symbol
            - price
            - currency
            - provider
            - isStale
            unevaluatedProperties: false
        warnings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  required:
                  - key
                  - value
                  unevaluatedProperties: false
            required:
            - code
            - message
            - details
            unevaluatedProperties: false
      required:
      - quotes
      unevaluatedProperties: false
    strategy:
      kind: deterministic
      toolId: signaldeck/finance/market_data_quote_lookup
      inputMapping:
        ref: agent.input
      outputMapping:
        ref: tool.output
    tools:
    - signaldeck/finance/market_data_quote_lookup
    resources:
    - finance-market-data
    budget:
      maxModelRequests: 6
      maxToolCalls: 8
      maxTokens: 18000
      deadlineSeconds: 180
      maxParallelTools: 3
  analyst:
    name: Market evidence analyst
    inputSchema:
      type: object
      properties:
        question:
          type: string
          minLength: 1
        perspective:
          type: string
        market:
          type: object
          properties:
            toolKey:
              const: signaldeck/finance/market_data_quote_lookup
              type: string
            quotes:
              type: array
              items:
                type: object
                properties:
                  symbol:
                    type: string
                  name:
                    type: string
                  price:
                    type: string
                  currency:
                    type: string
                  provider:
                    type: string
                  asOf:
                    type: string
                  isStale:
                    type: boolean
                  previousClose:
                    type: string
                required:
                - symbol
                - price
                - currency
                - provider
                - isStale
                unevaluatedProperties: false
            warnings:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: string
                      required:
                      - key
                      - value
                      unevaluatedProperties: false
                required:
                - code
                - message
                - details
                unevaluatedProperties: false
          required:
          - quotes
          unevaluatedProperties: false
      required:
      - question
      - perspective
      - market
    outputSchema:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required:
      - text
    strategy:
      kind: model
      modelRef: research-model
      prompt: Analyze the supplied market snapshot for the requested perspective. Use only
        supplied prices and source timestamps; distinguish stale or missing data. Do not invent
        facts. Write a concise evidence-based assessment and uncertainties; do not execute
        trades.
    tools: []
    resources: []
    budget:
      maxModelRequests: 6
      maxToolCalls: 8
      maxTokens: 18000
      deadlineSeconds: 180
      maxParallelTools: 3
  synthesize:
    name: Advisory report editor
    inputSchema:
      type: object
      properties:
        question:
          type: string
          minLength: 1
        market:
          type: object
          properties:
            toolKey:
              const: signaldeck/finance/market_data_quote_lookup
              type: string
            quotes:
              type: array
              items:
                type: object
                properties:
                  symbol:
                    type: string
                  name:
                    type: string
                  price:
                    type: string
                  currency:
                    type: string
                  provider:
                    type: string
                  asOf:
                    type: string
                  isStale:
                    type: boolean
                  previousClose:
                    type: string
                required:
                - symbol
                - price
                - currency
                - provider
                - isStale
                unevaluatedProperties: false
            warnings:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: string
                      required:
                      - key
                      - value
                      unevaluatedProperties: false
                required:
                - code
                - message
                - details
                unevaluatedProperties: false
          required:
          - quotes
          unevaluatedProperties: false
        opportunity:
          type: object
          properties:
            text:
              type: string
              minLength: 1
          required:
          - text
        risk:
          type: object
          properties:
            text:
              type: string
              minLength: 1
          required:
          - text
      required:
      - question
      - market
      - opportunity
      - risk
    outputSchema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          minLength: 1
      required:
      - name
      - content
      unevaluatedProperties: false
    strategy:
      kind: model
      modelRef: research-model
      prompt: Create a research report with name and content. Compare opportunity and risk
        evidence, identify stale data and missing risk review, include the question, quoted
        observations, uncertainties and practical follow-up research. Never claim a skipped
        risk review occurred. Return a report title of at most 160 characters.
    tools: []
    resources: []
    budget:
      maxModelRequests: 6
      maxToolCalls: 8
      maxTokens: 18000
      deadlineSeconds: 180
      maxParallelTools: 3
  save_report:
    name: Save Finance report
    inputSchema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          minLength: 1
      required:
      - name
      - content
      unevaluatedProperties: false
    outputSchema:
      type: object
      properties:
        reportId:
          type: integer
        name:
          type: string
      required:
      - reportId
      - name
    strategy:
      kind: deterministic
      toolId: signaldeck/finance/reports_create
      inputMapping:
        ref: agent.input
      outputMapping:
        object:
          reportId:
            ref: tool.output.id
          name:
            ref: tool.output.name
    tools:
    - signaldeck/finance/reports_create
    resources: []
    budget:
      maxModelRequests: 6
      maxToolCalls: 8
      maxTokens: 18000
      deadlineSeconds: 180
      maxParallelTools: 3
workflows:
  research:
    name: 市场研究
    inputSchema:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
            title: 研究对象
            x-signaldeck-schema: signaldeck.schema/2
            examples:
            - AAPL
          minItems: 1
          maxItems: 10
          title: 研究对象
        question:
          type: string
          minLength: 1
          title: 想了解什么
        includeRisk:
          type: boolean
          title: 包含风险分析
          x-signaldeck-schema: signaldeck.schema/2
          default: true
      required:
      - symbols
      - question
      - includeRisk
    outputSchema:
      type: object
      properties:
        reportId:
          type: integer
        name:
          type: string
      required:
      - reportId
      - name
    nodes:
      collect:
        uses: collect_quotes
        inputMapping:
          object:
            symbols:
              ref: workflow.input.symbols
      opportunity:
        uses: analyst
        dependsOn:
        - collect
        inputMapping:
          object:
            question:
              ref: workflow.input.question
            perspective:
              value: Opportunity and upside evidence
            market:
              ref: nodes.collect.output
      risk:
        uses: analyst
        inputMapping:
          object:
            question:
              ref: workflow.input.question
            perspective:
              value: Downside, uncertainty and disconfirming evidence
            market:
              ref: nodes.collect.output
        condition:
          op: all
          args:
          - op: exists
            args:
            - ref: nodes.collect.output.quotes
          - op: eq
            args:
            - ref: workflow.input.includeRisk
            - value: true
      summary:
        uses: synthesize
        acceptUpstreamStates:
        - succeeded
        - skipped
        inputMapping:
          object:
            question:
              ref: workflow.input.question
            market:
              ref: nodes.collect.output
              onMissing:
                value:
                  quotes: []
            opportunity:
              ref: nodes.opportunity.output
              onMissing:
                value:
                  text: Opportunity assessment is unavailable.
            risk:
              ref: nodes.risk.output
              onMissing:
                value:
                  text: Risk review was not requested and was skipped.
      save:
        uses: save_report
        inputMapping:
          ref: nodes.summary.output
    outputMapping:
      ref: nodes.save.output
    maxParallelNodes: 4
    deadlineSeconds: 900
    failurePolicy: continue_independent
    presentation:
      version: signaldeck.presentation/1
      inputHints:
      - ref: workflow.input.question
        control: textarea
        placeholder: 例如：最近有哪些变化？请说明依据和缺失信息。
      title:
        kind: input
        ref: workflow.input.question
      sections:
      - kind: markdown
        ref: nodes.summary.output.content
        label: 研究报告
        required: true
      - kind: markdown
        ref: nodes.risk.output.text
        label: 风险分析
      - kind: value
        ref: nodes.collect.output.quotes
        label: 行情证据
      - kind: receipt
        ref: nodes.save.output
        label: 报告保存凭据
        required: true
      - kind: link
        ref: nodes.save.output
        label: 在 Finance 中查看报告
        toolId: signaldeck/finance/reports_create
        linkKey: report
    description: 分析关注的市场对象、变化与风险，生成研究报告。
