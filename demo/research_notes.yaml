apiVersion: signaldeck.workflowPackage/v2
metadata:
  key: research_notes
  name: Research notes
  description: Search the research collection, optionally edit a note with a model, and store
    an immutable record. Save original text without a model using the capture workflow.
agents:
  find_notes:
    name: Search research collection
    inputSchema:
      type: object
      properties:
        query:
          type: string
          maxLength: 200
        limit:
          type: integer
          minimum: 1
          maximum: 50
      required: []
      unevaluatedProperties: false
    outputSchema:
      type: object
      properties:
        notes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              collection:
                type: string
              title:
                type: string
              text:
                type: string
            required:
            - id
            - collection
            - title
            - text
            unevaluatedProperties: false
      required:
      - notes
      unevaluatedProperties: false
    strategy:
      kind: deterministic
      toolId: example/notes/search
      inputMapping:
        ref: agent.input
      outputMapping:
        ref: tool.output
    tools:
    - example/notes/search
    resources:
    - notes-workspace
    budget:
      maxModelRequests: 6
      maxToolCalls: 8
      maxTokens: 18000
      deadlineSeconds: 180
      maxParallelTools: 3
  summarize:
    name: Research note editor
    inputSchema:
      type: object
      properties:
        text:
          type: string
          maxLength: 100000
        priorNotes:
          type: object
          properties:
            notes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  collection:
                    type: string
                  title:
                    type: string
                  text:
                    type: string
                required:
                - id
                - collection
                - title
                - text
                unevaluatedProperties: false
          required:
          - notes
          unevaluatedProperties: false
      required:
      - text
      - priorNotes
    outputSchema:
      type: object
      properties:
        text:
          type: string
          maxLength: 100000
      required:
      - text
    strategy:
      kind: model
      modelRef: research-model
      prompt: Edit the supplied research text into a clear note. Use prior notes only as attributed
        context and retain uncertainty. Do not invent external facts or claim new research.
        Keep the text under 100000 characters.
    tools: []
    resources: []
    budget:
      maxModelRequests: 6
      maxToolCalls: 8
      maxTokens: 18000
      deadlineSeconds: 180
      maxParallelTools: 3
  write_note:
    name: Save immutable research note
    inputSchema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        text:
          type: string
          maxLength: 100000
      required:
      - title
      - text
      unevaluatedProperties: false
    outputSchema:
      type: object
      properties:
        id:
          type: string
        collection:
          type: string
        title:
          type: string
        text:
          type: string
      required:
      - id
      - collection
      - title
      - text
      unevaluatedProperties: false
    strategy:
      kind: deterministic
      toolId: example/notes/create
      inputMapping:
        ref: agent.input
      outputMapping:
        ref: tool.output
    tools:
    - example/notes/create
    resources:
    - notes-workspace
    budget:
      maxModelRequests: 6
      maxToolCalls: 8
      maxTokens: 18000
      deadlineSeconds: 180
      maxParallelTools: 3
workflows:
  research:
    name: 整理笔记
    inputSchema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          title: 标题
        text:
          type: string
          maxLength: 100000
          title: 原文
        query:
          type: string
          maxLength: 200
          title: 查找已有笔记
        summarize:
          type: boolean
          title: 整理并总结原文
      required:
      - title
      - text
      - query
      - summarize
    outputSchema:
      type: object
      properties:
        id:
          type: string
        collection:
          type: string
        title:
          type: string
        text:
          type: string
      required:
      - id
      - collection
      - title
      - text
      unevaluatedProperties: false
    nodes:
      prior:
        uses: find_notes
        inputMapping:
          object:
            query:
              ref: workflow.input.query
            limit:
              value: 20
      edit:
        uses: summarize
        inputMapping:
          object:
            text:
              ref: workflow.input.text
            priorNotes:
              ref: nodes.prior.output
        condition:
          op: eq
          args:
          - ref: workflow.input.summarize
          - value: true
      save:
        uses: write_note
        dependsOn:
        - prior
        acceptUpstreamStates:
        - succeeded
        - skipped
        inputMapping:
          object:
            title:
              ref: workflow.input.title
            text:
              ref: nodes.edit.output.text
              onMissing:
                ref: workflow.input.text
    outputMapping:
      ref: nodes.save.output
    maxParallelNodes: 4
    deadlineSeconds: 900
    failurePolicy: continue_independent
    presentation:
      version: signaldeck.presentation/1
      inputHints:
      - ref: workflow.input.title
        control: text
        placeholder: 例如：本周产品访谈
      - ref: workflow.input.text
        control: textarea
        placeholder: 粘贴需要保存或整理的内容
      - ref: workflow.input.query
        control: text
        placeholder: 用于查找相关笔记的关键词，可留空
      title:
        kind: input
        ref: workflow.input.title
      sections:
      - kind: markdown
        ref: nodes.save.output.text
        label: 笔记正文
        required: true
      - kind: receipt
        ref: nodes.save.output
        label: 笔记保存凭据
        required: true
    description: 结合已有笔记整理资料，并保存新的笔记。
  capture:
    name: 保存原文
    inputSchema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          title: 标题
        text:
          type: string
          maxLength: 100000
          title: 原文
      required:
      - title
      - text
      unevaluatedProperties: false
    outputSchema:
      type: object
      properties:
        id:
          type: string
        collection:
          type: string
        title:
          type: string
        text:
          type: string
      required:
      - id
      - collection
      - title
      - text
      unevaluatedProperties: false
    nodes:
      save:
        uses: write_note
        inputMapping:
          ref: workflow.input
    outputMapping:
      ref: nodes.save.output
    maxParallelNodes: 4
    deadlineSeconds: 900
    failurePolicy: continue_independent
    presentation:
      version: signaldeck.presentation/1
      inputHints:
      - ref: workflow.input.title
        control: text
        placeholder: 例如：本周产品访谈
      - ref: workflow.input.text
        control: textarea
        placeholder: 粘贴需要保存或整理的内容
      title:
        kind: input
        ref: workflow.input.title
      sections:
      - kind: markdown
        ref: nodes.save.output.text
        label: 笔记正文
        required: true
      - kind: receipt
        ref: nodes.save.output
        label: 笔记保存凭据
        required: true
    description: 直接保存标题与原文，不需要模型服务。
