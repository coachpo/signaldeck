workflows:
  research:
    name: 美股多空研究
    description: 固定截止采集 SEC 财务与官方原文、行情新闻、FRED 宏观版本和显式选定的增强来源；共享证据完成有限多空研究，确定性校验后保存同一份规范正文。
    inputSchema:
      type: object
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 15
          title: 股票代码
          description: 美国上市公司的证券代码。
          x-signaldeck-schema: signaldeck.schema/2
          default: NVDA
          examples:
          - NVDA
        asOfDate:
          type: string
          minLength: 10
          maxLength: 10
          title: 分析截止日期
          description: 填写 YYYY-MM-DD，按美国市场日期；只使用截至该日已经公开的资料，不选择未来日期。
        horizonMonths:
          type: integer
          minimum: 1
          maximum: 24
          title: 判断期限（月）
          x-signaldeck-schema: signaldeck.schema/2
          default: 3
        question:
          type: string
          minLength: 1
          maxLength: 2000
          title: 研究问题
          description: 说明最关心的上涨或下跌驱动因素。
          x-signaldeck-schema: signaldeck.schema/2
          default: 综合公司财务、宏观环境、新闻与美国政策，判断该股票在指定期限内偏多、偏空、中性还是证据不足，并解释原因和反证。
        previousReport:
          type: string
          maxLength: 16000
          title: 上一份研究报告
          description: 可选。粘贴含股票、截止日、判断期限、方向及来源的上一份报告；仅用于比较，不作为本次事实。
        supportingMaterials:
          type: array
          title: 补充资料
          description: 可选。提供宏观数据、财报摘录或新闻政策原文，并填写来源和公开日期；未核实资料会明确标记。
          maxItems: 8
          items:
            type: object
            properties:
              category:
                type: string
                title: 资料类别
                enum:
                - 宏观数据
                - 公司财报
                - 新闻
                - 美国政策
                - 其他
              title:
                type: string
                minLength: 1
                maxLength: 160
                title: 资料标题
              publishedDate:
                type: string
                minLength: 10
                maxLength: 10
                title: 公开日期
              source:
                type: string
                minLength: 1
                maxLength: 1000
                title: 来源链接或出处
              content:
                type: string
                minLength: 1
                maxLength: 6000
                title: 资料正文或数据
            required:
            - category
            - title
            - publishedDate
            - source
            - content
            unevaluatedProperties: false
        macroSeriesIds:
          maxItems: 5
          type: array
          items:
            type: string
          title: 宏观序列
          x-signaldeck-schema: signaldeck.schema/2
          default:
          - CPIAUCSL
          - CPILFESL
          - A191RL1Q225SBEA
          - UNRATE
          - FEDFUNDS
          description: 默认核对通胀、增长、失业率与政策利率。显式选择最多五个 FRED 序列；只使用截止前已可取得的版本，观察期不等于公开时间。
        sourceUrls:
          maxItems: 5
          type: array
          items:
            type: string
          title: 官方原文链接
          x-signaldeck-schema: signaldeck.schema/2
          default: []
        includeSocial:
          type: boolean
          title: 启用社交样本
          x-signaldeck-schema: signaldeck.schema/2
          default: false
        includeInsider:
          type: boolean
          title: 启用内部人申报
          x-signaldeck-schema: signaldeck.schema/2
          default: false
        includePrediction:
          type: boolean
          title: 启用指定预测事件
          x-signaldeck-schema: signaldeck.schema/2
          default: false
        events:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              venue:
                enum:
                - polymarket
                - kalshi
                type: string
              eventId:
                maxLength: 160
                minLength: 1
                type: string
              contractId:
                maxLength: 160
                minLength: 1
                type: string
              hypothesis:
                maxLength: 1000
                minLength: 1
                type: string
              reason:
                maxLength: 1000
                minLength: 1
                type: string
            required:
            - venue
            - hypothesis
            - reason
            unevaluatedProperties: false
          title: 预测事件及关联理由
          x-signaldeck-schema: signaldeck.schema/2
          default: []
        lookbackDays:
