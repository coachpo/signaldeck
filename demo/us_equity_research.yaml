                value: 该论证或回应未取得确认结果；不能宣称该阶段已完成，须在报告说明限制。
            bearReply:
              ref: nodes.bear_reply.output.content
              onMissing:
                value: 该论证或回应未取得确认结果；不能宣称该阶段已完成，须在报告说明限制。
            previousReport:
              ref: workflow.input.previousReport
              onMissing:
                value: ''
            riskReview:
              ref: nodes.risk.output.content
              onMissing:
                value: 独立风险复核未取得确认结果；不得声称已完成风险复核。说明缺失，证据可信度为low；关键事实无法核对时选insufficient_evidence。
            cutoffAt:
              ref: nodes.scope.output.cutoffAt
              onMissing:
                value: ''
            evidence:
              ref: nodes.collection.output.analysisEvidence
              onMissing:
                value: []
            analysisContextTruncated:
              ref: nodes.collection.output.analysisContextTruncated
              onMissing:
                value: true
            collectionGaps:
              ref: nodes.collection.output.gaps
              onMissing:
                value:
                - 证据合并失败；研究证据不足。
            bullArguments:
              ref: nodes.bull.output.case
              onMissing:
                value: {}
            bearArguments:
              ref: nodes.bear.output.case
              onMissing:
                value: {}
            bullResponse:
              ref: nodes.bull_reply.output.response
              onMissing:
                value: {}
            bearResponse:
              ref: nodes.bear_reply.output.response
              onMissing:
                value: {}
            riskAssessment:
              ref: nodes.risk.output.review
              onMissing:
                value: {}
      compile:
        uses: compile_report
        inputMapping:
          object:
            symbol:
              ref: workflow.input.symbol
            asOfDate:
              ref: workflow.input.asOfDate
            cutoffAt:
              ref: nodes.scope.output.cutoffAt
              onMissing:
                value: ''
            evidence:
              ref: nodes.collection.output.evidence
              onMissing:
                value: []
            upstreamGaps:
              ref: nodes.collection.output.gaps
              onMissing:
                value:
                - 证据集合不可用。
            claims:
              ref: nodes.decision.output.claims
              onMissing:
                value: []
            thresholds:
              ref: nodes.decision.output.thresholds
              onMissing:
                value: []
            narrative:
              ref: nodes.decision.output.content
              onMissing:
                value: 分析阶段未完成；仅保留实际取得的证据与缺口。
            comparison:
              ref: nodes.decision.output.changes
              onMissing:
                value: 未完成历史文字比较；不能推断研究判断已发生变化。
            discussion:
              object:
                bullCase:
                  ref: nodes.bull.output.case
                  onMissing:
                    value: {}
                bearCase:
                  ref: nodes.bear.output.case
                  onMissing:
                    value: {}
                bullResponse:
                  ref: nodes.bull_reply.output.response
                  onMissing:
                    value: {}
                bearResponse:
                  ref: nodes.bear_reply.output.response
                  onMissing:
                    value: {}
                riskReview:
                  ref: nodes.risk.output.review
                  onMissing:
                    value: {}
                adjudication:
                  ref: nodes.decision.output.judgment
                  onMissing:
                    value: {}
        acceptUpstreamStates:
        - succeeded
        - failed
        - timed_out
        - blocked
        - skipped
      save:
        uses: save_report
        inputMapping:
          object:
            name:
              ref: nodes.compile.output.name
            content:
              ref: nodes.compile.output.content
    outputMapping:
      object:
        name:
          ref: nodes.compile.output.name
        content:
          ref: nodes.compile.output.content
        status:
          ref: nodes.compile.output.status
        dataGaps:
          ref: nodes.compile.output.dataGaps
        evidence:
          ref: nodes.compile.output.evidence
        narrativeStatus:
          ref: nodes.compile.output.narrativeStatus
        independentSourceCount:
          ref: nodes.compile.output.independentSourceCount
        cutoffAt:
          ref: nodes.compile.output.cutoffAt
        reportId:
          ref: nodes.save.output.reportId
        symbol:
          ref: workflow.input.symbol
        asOfDate:
          ref: workflow.input.asOfDate
        horizonMonths:
          ref: workflow.input.horizonMonths
        stance:
          ref: nodes.decision.output.stance
          onMissing:
            value: insufficient_evidence
        reasons:
          ref: nodes.decision.output.reasons
          onMissing:
            value:
            - 模型分析未完成。
        counterevidence:
          ref: nodes.decision.output.counterevidence
          onMissing:
            value: []
        invalidation:
          ref: nodes.decision.output.invalidation
          onMissing:
            value:
            - 证据不足时不作方向判断。
        evidenceConfidence:
          ref: nodes.decision.output.evidenceConfidence
          onMissing:
            value: low
        sources:
          ref: nodes.decision.output.sources
          onMissing:
            value: []
        changes:
          ref: nodes.decision.output.changes
          onMissing:
            value: 未完成历史文字比较；不能推断研究判断已发生变化。
        modelAssessmentStatus:
          value: unverified
    maxParallelNodes: 2
    deadlineSeconds: 3600
    failurePolicy: continue_independent
    presentation:
      version: signaldeck.presentation/1
      inputHints:
      - ref: workflow.input.symbol
        control: text
        placeholder: 例如：NVDA
      - ref: workflow.input.asOfDate
        control: text
        placeholder: YYYY-MM-DD
      - ref: workflow.input.question
        control: textarea
        placeholder: 希望判断哪些驱动因素，或重点核实什么？
      - ref: workflow.input.previousReport
        control: textarea
        placeholder: 可选：粘贴上次报告，保留股票、日期、期限、方向和来源。
      title:
        kind: input
        ref: workflow.input.symbol
      sections:
      - kind: markdown
        ref: nodes.compile.output.content
        label: 规范研究报告
        required: true
      - kind: value
        ref: nodes.compile.output.status
        label: 证据校验状态
      - kind: value
        ref: nodes.decision.output.stance
        label: 模型方向判断（未核实）
      - kind: markdown
        ref: nodes.decision.output.changes
        label: 较上次的变化（未核实模型对比）
      - kind: value
        ref: nodes.compile.output.dataGaps
        label: 资料缺口
      - kind: receipt
        ref: nodes.save.output
        label: 报告保存凭据
        required: true
      - kind: link
        ref: nodes.save.output
        label: 在 Finance 中查看报告
        toolId: signaldeck/finance/research_reports_create
        linkKey: report
  monitor:
    name: 美股证据变化监测
    description: 每次触发冻结新截止，比较同范围有效证据；资料无效或无实质变化跳过深研究，仅首次基线或实质变化执行研究并绑定快照。 采集固定回看七天行情、新闻及可选社交，财务最近四个可用期间；资料覆盖与判断期限不同，不承诺完整历史。
    inputSchema:
      type: object
      properties:
        monitorKey:
          maxLength: 160
          minLength: 1
          type: string
          title: 监测标识
        scope:
          type: object
          properties:
            symbol:
              maxLength: 24
              minLength: 1
              type: string
              title: 股票代码
              x-signaldeck-schema: signaldeck.schema/2
              default: NVDA
            cik:
              maxLength: 10
              minLength: 10
              type: string
              title: SEC 公司标识（十位数字）
              x-signaldeck-schema: signaldeck.schema/2
              default: '0001045810'
            question:
              maxLength: 2000
              minLength: 1
              type: string
              title: 研究问题
              x-signaldeck-schema: signaldeck.schema/2
              default: 跟踪公司披露与财务变化，核查原判断是否仍成立。
            horizonMonths:
              maximum: 120
              minimum: 1
              type: integer
              title: 研究期限（月）
              x-signaldeck-schema: signaldeck.schema/2
              default: 3
            ruleVersion:
              maxLength: 100
              minLength: 1
              type: string
              title: 变化规则版本
              x-signaldeck-schema: signaldeck.schema/2
              default: '1'
            sources:
              maxItems: 30
              minItems: 1
              type: array
              items:
                type: object
                properties:
                  sourceId:
                    maxLength: 200
                    minLength: 1
                    type: string
                  required:
                    type: boolean
                  maxAgeSeconds:
                    maximum: 31536000
                    minimum: 1
                    type: integer
                  eventId:
                    type: string
                  contractId:
                    type: string
                required:
                - sourceId
                - maxAgeSeconds
                unevaluatedProperties: false
              title: 选定来源与新鲜度
              x-signaldeck-schema: signaldeck.schema/2
              default:
              - sourceId: sec
                required: true
                maxAgeSeconds: 86400
              - sourceId: documents
                required: true
                maxAgeSeconds: 86400
              - sourceId: market
                required: false
                maxAgeSeconds: 86400
              - sourceId: news
                required: false
                maxAgeSeconds: 86400
              - sourceId: macro
                required: false
                maxAgeSeconds: 86400
              - sourceId: valuation
                required: false
                maxAgeSeconds: 86400
              description: 来源标识：sec、documents、market、news、macro、valuation；增强来源为 social、insider、prediction。只有选定范围内满足完整性和新鲜度的证据才能建立有效基线。
            rules:
              maxItems: 30
              type: array
              items:
                type: object
                properties:
                  concept:
                    minLength: 1
                    type: string
                  unit:
                    minLength: 1
                    type: string
                  direction:
                    enum:
                    - increase
                    - decrease
                    - either
                    type: string
                  absoluteChange:
                    maxLength: 120
                    minLength: 1
                    type: string
                required:
                - concept
                - unit
                - direction
                - absoluteChange
                unevaluatedProperties: false
              title: 显式指标触发阈值
              x-signaldeck-schema: signaldeck.schema/2
              default: []
              description: 未配置指标阈值时，行情与预测报价只记录，不单独触发深研究。更改规则时更新 ruleVersion。
            sourceUrls:
              maxItems: 5
              type: array
              items:
                type: string
              title: 官方原文链接
              x-signaldeck-schema: signaldeck.schema/2
              default: []
            includeSocial:
              type: boolean
              title: 启用社交样本
              x-signaldeck-schema: signaldeck.schema/2
              default: false
            includeInsider:
              type: boolean
              title: 启用内部人申报
              x-signaldeck-schema: signaldeck.schema/2
              default: false
            includePrediction:
              type: boolean
              title: 启用指定预测事件
              x-signaldeck-schema: signaldeck.schema/2
              default: false
            macroSeriesIds:
              maxItems: 5
              type: array
              items:
                type: string
              title: 宏观序列
              x-signaldeck-schema: signaldeck.schema/2
              default:
              - CPIAUCSL
              - CPILFESL
              - A191RL1Q225SBEA
              - UNRATE
              - FEDFUNDS
            events:
              maxItems: 3
              type: array
              items:
                type: object
                properties:
                  venue:
                    enum:
                    - polymarket
                    - kalshi
                    type: string
                  eventId:
                    maxLength: 160
                    minLength: 1
                    type: string
                  contractId:
                    maxLength: 160
                    minLength: 1
                    type: string
                  hypothesis:
                    maxLength: 1000
                    minLength: 1
                    type: string
                  reason:
                    maxLength: 1000
                    minLength: 1
                    type: string
                required:
                - venue
                - hypothesis
                - reason
                unevaluatedProperties: false
              title: 预测事件及关联理由
              x-signaldeck-schema: signaldeck.schema/2
              default: []
          required:
          - symbol
          - cik
          - question
          - horizonMonths
          - ruleVersion
          - sources
          unevaluatedProperties: false
          title: 研究范围与触发规则
      required:
      - monitorKey
      - scope
      unevaluatedProperties: false
    outputSchema:
      type: object
      properties:
        snapshotId:
          type: string
        state:
          type: string
        changes:
          type: array
          items:
            type: object
            properties:
              kind:
                enum:
                - new_disclosure
                - fact_revision
                - metric_threshold
                - contract_changed
                - contract_closed
                type: string
              evidenceId:
                type: string
              previousEvidenceId:
                type: string
              description:
                type: string
            required:
            - kind
            - evidenceId
            - description
            unevaluatedProperties: false
        warnings:
          type: array
          items:
            type: string
        content:
          type: string
        reportStatus:
          type: string
        reportId:
          type: integer
      required:
      - snapshotId
      - state
      - changes
      - warnings
      - content
      - reportStatus
      - reportId
      unevaluatedProperties: false
