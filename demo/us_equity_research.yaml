workflows:
  research:
    name: 美股多空研究
    description: 并行核对行情、公司、宏观与新闻政策，进行一轮多空论证和回应，经风险复核后给出指定期限的方向判断与中文报告，可对照上次报告解释变化；关键资料不足时明确暂不能判断。
    inputSchema:
      type: object
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 15
          title: 股票代码
          description: 美国上市公司的证券代码。
          x-signaldeck-schema: signaldeck.schema/2
          default: NVDA
          examples:
          - NVDA
        asOfDate:
          type: string
          minLength: 10
          maxLength: 10
          title: 分析截止日期
          description: 填写 YYYY-MM-DD，按美国市场日期；只使用截至该日已经公开的资料，不选择未来日期。
        horizonMonths:
          type: integer
          minimum: 1
          maximum: 24
          title: 判断期限（月）
          x-signaldeck-schema: signaldeck.schema/2
          default: 3
        question:
          type: string
          minLength: 1
          maxLength: 2000
          title: 研究问题
          description: 说明最关心的上涨或下跌驱动因素。
          x-signaldeck-schema: signaldeck.schema/2
          default: 综合公司财务、宏观环境、新闻与美国政策，判断该股票在指定期限内偏多、偏空、中性还是证据不足，并解释原因和反证。
        previousReport:
          type: string
          maxLength: 16000
          title: 上一份研究报告
          description: 可选。粘贴含股票、截止日、判断期限、方向及来源的上一份报告；仅用于比较，不作为本次事实。
        supportingMaterials:
          type: array
          title: 补充资料
          description: 可选。提供宏观数据、财报摘录或新闻政策原文，并填写来源和公开日期；未核实资料会明确标记。
          maxItems: 8
          items:
            type: object
            properties:
              category:
                type: string
                title: 资料类别
                enum:
                - 宏观数据
                - 公司财报
                - 新闻
                - 美国政策
                - 其他
              title:
                type: string
                minLength: 1
                maxLength: 160
                title: 资料标题
              publishedDate:
                type: string
                minLength: 10
                maxLength: 10
                title: 公开日期
              source:
                type: string
                minLength: 1
                maxLength: 1000
                title: 来源链接或出处
              content:
                type: string
                minLength: 1
                maxLength: 6000
                title: 资料正文或数据
            required:
            - category
            - title
            - publishedDate
            - source
            - content
            unevaluatedProperties: false
      required:
      - symbol
      - asOfDate
      - horizonMonths
      - question
      unevaluatedProperties: false
    outputSchema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          title: 报告标题
        symbol:
          type: string
          minLength: 1
          maxLength: 15
          title: 研究股票
        asOfDate:
          type: string
          minLength: 10
          maxLength: 10
          title: 分析截止日期
        horizonMonths:
          type: integer
          minimum: 1
          maximum: 24
          title: 判断期限（月）
        stance:
          type: string
          title: 方向判断
          enum:
          - bullish
          - bearish
          - neutral
          - insufficient_evidence
        reasons:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 600
          minItems: 1
          maxItems: 6
          title: 主要依据
        counterevidence:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 600
          minItems: 0
          maxItems: 6
          title: 反向证据与分歧
        invalidation:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 600
          minItems: 1
          maxItems: 6
          title: 判断失效条件
        dataGaps:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 600
          minItems: 0
          maxItems: 12
          title: 尚缺资料
        evidenceConfidence:
          type: string
          title: 证据可信度
          enum:
          - low
          - medium
          - high
        sources:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1200
          minItems: 0
          maxItems: 24
          title: 引用来源
        changes:
          type: string
          minLength: 1
          maxLength: 4000
          title: 较上次的变化
        content:
          type: string
          minLength: 1
          maxLength: 16000
          title: 中文研究报告
        reportId:
          type: integer
          title: 报告凭据
      required:
