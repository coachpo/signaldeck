apiVersion: signaldeck.workflowPackage/v2
metadata:
  key: digital_oracle_researcher
  name: Digital Oracle research
  description: Run parallel specialist research with independently deployed Oracle tools and
    retain the final report in Finance.
agents:
  researcher:
    name: Digital Oracle specialist
    inputSchema:
      type: object
      properties:
        question:
          type: string
          minLength: 1
        focus:
          type: string
      required:
      - question
      - focus
    outputSchema:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required:
      - text
    strategy:
      kind: model
      modelRef: research-model
      prompt: Research the question using the granted Digital Oracle tools appropriate to the
        focus. Read tool schemas before choosing arguments. Cite returned sources and
        timestamps. State provider unavailability and distinguish facts from inference; never
        invent data when a provider is unavailable. Produce a concise research note.
    tools:
    - signaldeck/digital-oracle/prediction_markets_lookup
    - signaldeck/digital-oracle/sec_filings_lookup
    - signaldeck/digital-oracle/market_sentiment_lookup
    - signaldeck/digital-oracle/macro_rates_lookup
    - signaldeck/digital-oracle/crypto_derivatives_lookup
    - signaldeck/digital-oracle/cftc_positioning_lookup
    - signaldeck/digital-oracle/options_lookup
    resources: []
    budget:
      maxModelRequests: 6
      maxToolCalls: 8
      maxTokens: 18000
      deadlineSeconds: 180
      maxParallelTools: 3
  editor:
    name: Cross-source research editor
    inputSchema:
      type: object
      properties:
        question:
          type: string
          minLength: 1
        macro:
          type: object
          properties:
            text:
              type: string
              minLength: 1
          required:
          - text
        company:
          type: object
          properties:
            text:
              type: string
              minLength: 1
          required:
          - text
      required:
      - question
      - macro
      - company
    outputSchema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          minLength: 1
      required:
      - name
      - content
      unevaluatedProperties: false
    strategy:
      kind: model
      modelRef: research-model
      prompt: Synthesize the two research notes into one report with name and content. Preserve
        source attribution, disagreements, provider limitations and dates. Include unanswered
        questions. Keep the report name within 160 characters.
    tools: []
    resources: []
    budget:
      maxModelRequests: 6
      maxToolCalls: 8
      maxTokens: 18000
      deadlineSeconds: 180
      maxParallelTools: 3
  save_report:
    name: Save Finance report
    inputSchema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          minLength: 1
      required:
      - name
      - content
      unevaluatedProperties: false
    outputSchema:
      type: object
      properties:
        reportId:
          type: integer
        name:
          type: string
      required:
      - reportId
      - name
    strategy:
      kind: deterministic
      toolId: signaldeck/finance/reports_create
      inputMapping:
        ref: agent.input
      outputMapping:
        object:
          reportId:
            ref: tool.output.id
          name:
            ref: tool.output.name
    tools:
    - signaldeck/finance/reports_create
    resources: []
    budget:
      maxModelRequests: 6
      maxToolCalls: 8
      maxTokens: 18000
      deadlineSeconds: 180
      maxParallelTools: 3
workflows:
  research:
    name: Cross-source research
    inputSchema:
      type: object
      properties:
        question:
          type: string
          minLength: 1
      required:
      - question
    outputSchema:
      type: object
      properties:
        reportId:
          type: integer
        name:
          type: string
      required:
      - reportId
      - name
    nodes:
      macro:
        uses: researcher
        inputMapping:
          object:
            question:
              ref: workflow.input.question
            focus:
              value: Macro rates, positioning, derivatives and prediction-market context
      company:
        uses: researcher
        inputMapping:
          object:
            question:
              ref: workflow.input.question
            focus:
              value: Company filings, market sentiment and options evidence
      editor:
        uses: editor
        inputMapping:
          object:
            question:
              ref: workflow.input.question
            macro:
              ref: nodes.macro.output
            company:
              ref: nodes.company.output
      save:
        uses: save_report
        inputMapping:
          ref: nodes.editor.output
    outputMapping:
      ref: nodes.save.output
    maxParallelNodes: 4
    deadlineSeconds: 900
    failurePolicy: continue_independent
